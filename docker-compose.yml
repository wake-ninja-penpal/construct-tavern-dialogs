# ─────────────────────────────────────────────────────────────────────────────
# «Ветви» — весь проект в Docker (Next.js + realtime-sync + шлюз).
#
# Запуск:      sudo docker-compose up --build   (старый docker-compose v1)
#              docker compose up --build        (новый docker compose v2)
# Приложение:  http://localhost:8080
#              (порт меняется: APP_PORT=8081 в файле .env рядом с compose —
#               править сам файл не нужно)
# Стоп:        sudo docker-compose down         (данные sync сохранятся в volume sync-data)
#
# Формат: version 2.4 — работает и в docker-compose v1 (1.29+), и в
# docker compose v2 (v2 лишь предупредит, что version устарел — это нормально).
#
# Сети:
#   internal     — внутренняя сеть стека (web ↔ sync ↔ gateway)
#   nginxnetwork — ВНЕШНЯЯ сеть (создана compose-файлом вашего nginx):
#                  gateway подключён к ней, поэтому nginx достаёт шлюз
#                  по имени контейнера:  http://vetvi-gateway:80
#
# Volumes:
#   sync-data — SQLite realtime-синхронизации (проекты)
#   web-data  — SQLite авторизации (/app/db/custom.db: аккаунты, сессии,
#               ссылки-инвайты, доступы к проектам). Монтируется и в sync
#               (/db) — realtime-сервер читает сессии/доступы из той же базы.
#
# Схема повторяет Caddy-шлюз песочницы:
#   браузер → gateway(:80) ─┬─ /  (всё остальное)        → vetvi-web:3000   (Next.js, /vetvi/index.html)
#                           └─ /?XTransformPort=3003     → vetvi-sync:3003  (socket.io realtime)
# ─────────────────────────────────────────────────────────────────────────────
version: "2.4"

services:
  # Next.js — отдаёт приложение «Ветви» (/vetvi/index.html) и статику
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: vetvi-web:latest
    container_name: vetvi-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      # База авторизации: абсолютный путь внутрь volume (см. volumes ниже) —
      # иначе Prisma решает file:-путь относительно схемы в node_modules.
      # connection_limit=1 — один запрос за раз: вторая запись в SQLite из
      # другого процесса (sync читает ту же базу) не упрётся в busy-конфликт.
      DATABASE_URL: "file:/app/db/custom.db?connection_limit=1&socket_timeout=15"
    volumes:
      - web-data:/app/db
    expose:
      - "3000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Realtime-сервер совместного редактирования (socket.io, path '/')
  # Состояние хранится в SQLite /app/data/store.db — он в volume, поэтому
  # проекты переживают перезапуск контейнера. Каждая комната — отдельная
  # запись; legacy data/store.json мигрируется в БД при первом старте.
  sync:
    build:
      context: ./mini-services/vetvi-sync
      dockerfile: Dockerfile
    image: vetvi-sync:latest
    container_name: vetvi-sync
    restart: unless-stopped
    environment:
      # Главная БД (аккаунты, сессии, доступы ProjectAccess) — тот же volume
      # web-data, что у web. Без неё sync не проверяет сессии: все участники
      # комнат считаются гостями только для чтения (владелец теряет право
      # редактирования). Монтируем без :ro — WAL-режиму нужны -shm/-wal файлы.
      VETVI_MAIN_DB: "/db/custom.db"
    volumes:
      - sync-data:/app/data
      - web-data:/db
    expose:
      - "3003"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3003/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Шлюз (Caddy) — единственная точка входа, как в песочнице.
  # Подключён и к internal (доступ к web/sync), и к внешней сети nginx,
  # чтобы ваш nginx мог проксировать на http://vetvi-gateway:80 по имени.
  gateway:
    image: caddy:2-alpine
    container_name: vetvi-gateway
    restart: unless-stopped
    depends_on:
      - web
      - sync
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - internal
      - nginxnetwork

networks:
  internal:
    driver: bridge
  nginxnetwork:
    external: true

volumes:
  sync-data:
  web-data:
