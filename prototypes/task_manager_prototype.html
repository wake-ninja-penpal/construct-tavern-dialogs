const sp=form.querySelector('[name=sprintId]');if(sp)sp.innerHTML='<option value="">Без спринта</option>'+sprintsOf(pid).map(s=>'<option value="'+s.id+'">'+esc(s.title)+'</option>').join('');return}
if(t.id==='importFile'){if(t.files[0])doImport(t.files[0]);t.value='';return}
const tk=task(S.ui.drawerId);if(!tk)return;
if(f==='d-board'){if(!guardEdit(tk.projectId))return;
if(!t.value){moveTasks([tk.id],{backlog:true});renderDrawerKeep(tk)}
else{const fc=colsOf(t.value)[0];if(fc){moveTasks([tk.id],{columnId:fc.id});renderDrawerKeep(tk)}
else{toast({msg:'На доске нет колонок',icon:'alert',tone:'warn'});renderDrawerKeep(tk)}}return}
if(f==='d-column'){if(!guardEdit(tk.projectId))return;moveTasks([tk.id],{columnId:t.value});renderDrawerKeep(tk)}
});
document.addEventListener('keydown',e=>{
const t=e.target,typing=t.closest&&t.closest('input,textarea,select,[contenteditable="true"]');
if(t.dataset&&t.dataset.addCol&&e.key==='Enter'){e.preventDefault();
const v=t.value.trim();if(!v)return;const c=column(t.dataset.addCol);if(!c)return;const b=board(c.boardId);
const nt=createTask({projectId:b.projectId,boardId:b.id,columnId:c.id,title:v},{silent:true});
if(nt){const inp=$('[data-add-col="'+c.id+'"]');if(inp)inp.focus();
const card=$('.card[data-id="'+nt.id+'"]');if(card){card.classList.add('flash');card.scrollIntoView({block:'nearest'})}}return}
if(t.dataset&&t.dataset.addBacklog&&e.key==='Enter'){e.preventDefault();
const v=t.value.trim();if(!v)return;const nt=createTask({projectId:t.dataset.addBacklog,title:v},{silent:true});
if(nt){const inp=$('[data-add-backlog="'+nt.projectId+'"]');if(inp)inp.focus();
const row=$('.trow[data-id="'+nt.id+'"]');if(row){row.classList.add('flash');row.scrollIntoView({block:'nearest'})}}return}
if(t.dataset&&t.dataset.field==='child-new'&&e.key==='Enter'){e.preventDefault();
const tk=task(S.ui.drawerId),v=t.value.trim();if(!tk||!v||!guardEdit(tk.projectId))return;
const nt=createTask({projectId:tk.projectId,parentId:tk.id,title:v},{silent:true});
if(nt){const inp=$('#drawer [data-field="child-new"]');if(inp)inp.focus();
const row=$('.child-row[data-id="'+nt.id+'"]');if(row)row.classList.add('flash')}return}
if(t.dataset&&t.dataset.field==='chat'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();return}
if(t.dataset&&t.dataset.field==='md'){
const mod=e.ctrlKey||e.metaKey;
if(mod&&['b','i','k'].includes(e.key.toLowerCase())){e.preventDefault();mdApply(e.key.toLowerCase()==='b'?'bold':e.key.toLowerCase()==='i'?'italic':'link');return}
if(e.key==='Tab'){e.preventDefault();const s=t.selectionStart;t.value=t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd);t.setSelectionRange(s+2,s+2);mdChanged(t);return}
if(e.key==='Enter'&&!e.shiftKey&&!mod){
const v=t.value,s=t.selectionStart,ls=v.lastIndexOf('\n',s-1)+1,line=v.slice(ls,s),m=line.match(/^(\s*)(- \[[ xX]\] |[-*+] |\d+[.)] )(.*)$/);
if(m){e.preventDefault();
if(!m[3].trim()){t.value=v.slice(0,ls)+v.slice(s);t.setSelectionRange(ls,ls);mdChanged(t);return}
let pref=m[2];if(/\d/.test(pref))pref=(parseInt(pref)+1)+'. ';if(/\[[xX]\]/.test(pref))pref=pref.replace(/\[[xX]\]/,'[ ]');
const ins='\n'+m[1]+pref;t.value=v.slice(0,s)+ins+v.slice(t.selectionEnd);t.setSelectionRange(s+ins.length,s+ins.length);mdChanged(t)}}
return}
if(t.dataset&&t.dataset.field==='st-label-new'&&e.key==='Enter'){e.preventDefault();
const tk=task(S.ui.drawerId),v=t.value.trim().toLowerCase().replace(/^#/,'');if(!tk||!v||!guardEdit(tk.projectId))return;
let l=S.labels.find(x=>x.name===v);
if(!l){l={id:uid(),name:v,color:PALETTE[(S.labels.length+3)%8]};S.labels.push(l);dbPut('labels',l)}
if(!tk.stickers.labels.includes(l.id))tk.stickers.labels.push(l.id);
saveTask(tk,true);reopenPop();snd.tick();
const inp=$('#popover [data-field="st-label-new"]');if(inp)inp.focus();return}
if(t.dataset&&(t.dataset.addCol||t.dataset.addBacklog||t.dataset.field==='child-new')&&e.key==='Escape'){t.blur();return}
if(t.id==='search'&&e.key==='Escape'){t.value='';S.ui.query='';$('#searchBox').classList.remove('has');refresh();t.blur();return}
if(e.key==='Escape'){
if(dragState)return;
if($('#modalRoot').classList.contains('show')){closeModal();return}
if(popKind){closePop();return}
if(S.ui.drawerId){if(S.ui.drawerStack.length)drawerBack();else closeDrawer();return}
if(S.ui.selection.size||S.ui.selMode){clearSel();refresh();return}
if(S.ui.query){$('#search').value='';S.ui.query='';$('#searchBox').classList.remove('has');refresh();return}
document.body.classList.remove('side-open');return}
if((e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10'))&&!typing){
const c=e.target.closest&&e.target.closest('.card,.trow,.child-row');
if(c){e.preventDefault();const r=c.getBoundingClientRect();
openTaskCtx(c.dataset.id,c.dataset.child==='1',r.left+Math.min(60,r.width/2),r.top+Math.min(40,r.height/2));return}}
if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();undoLast();return}
if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!typing){e.preventDefault();$('#search').focus();return}
if(e.shiftKey&&e.key.toLowerCase()==='m'&&S.ui.drawerId&&!typing){e.preventDefault();
S.ui.drawerMode=S.ui.drawerMode==='side'?'wide':S.ui.drawerMode==='wide'?'full':'side';
applyDrawerMode();savePrefs();const tk=task(S.ui.drawerId);if(tk)renderDrawerKeep(tk);return}
if(typing)return;
if(e.ctrlKey||e.metaKey||e.altKey)return;
if(e.key==='['||e.key==='х'){e.preventDefault();railToggle();return}
if(e.key==='/'){e.preventDefault();$('#search').focus();return}
if(e.key==='?'){shortcutsModal();return}
if(e.key.toLowerCase()==='n'||e.key.toLowerCase()==='т'){e.preventDefault();taskModal(null);return}
if(e.key.toLowerCase()==='d'){e.preventDefault();S.ui.density=S.ui.density==='compact'?'cozy':'compact';refresh();snd.tick();
toast({msg:S.ui.density==='compact'?'Компактные карточки — описания скрыты':'Обычный вид — с кратким описанием',icon:'rows',tone:'info'});return}
if(e.key==='Delete'){const c=e.target.closest&&e.target.closest('.card,.trow');
if(c){e.preventDefault();deleteTasks([c.dataset.id]);return}}
if(e.key==='Enter'||e.key===' '){const c=e.target.closest&&e.target.closest('.card,.trow,.child-row');
if(c){e.preventDefault();openDrawer(c.dataset.id,c.classList.contains('child-row'))}}
});
document.addEventListener('focusout',e=>{
if(e.target.dataset&&e.target.dataset.field==='d-title'){const t=task(S.ui.drawerId);if(t&&!e.target.value.trim())e.target.value=t.title}
});
document.addEventListener('pointerdown',e=>{
snd.unlock();
if(popKind&&!e.target.closest('#popover')&&!e.target.closest('[data-popanchor]'))closePop();
if(e.button===2)return;
if(dragState||(e.button&&e.button!==0))return;
const grip=e.target.closest('[data-grip],[data-grip-col],[data-grip-child]');
if(e.pointerType==='touch'&&!grip)return;
if(!grip&&e.target.closest('button,input,textarea,select,a,[contenteditable="true"]'))return;
const colGrip=e.target.closest('[data-grip-col]');
if(colGrip){const colEl=colGrip.closest('.kcol'),b=board(S.ui.boardId);
if(!colEl||!b||!canEdit(b.projectId))return;e.preventDefault();
beginDrag(e,colEl,{mode:'column',item:'.kcol',container:$('#kanban'),rot:.5,drop:commitColumnDrop});return}
const childGrip=e.target.closest('[data-grip-child]');
const childRow=childGrip?childGrip.closest('.child-row'):e.target.closest('#dChildren .child-row');
if(childRow){const t=task(childRow.dataset.id);if(!t||!canEdit(t.projectId))return;
if(childGrip)e.preventDefault();
beginDrag(e,childRow,{mode:'list',item:'.child-row',container:$('#dChildren'),scroller:$('#drawer .d-main'),rot:.8,drop:commitChildDrop});return}
const card=e.target.closest('#kanban .card');
if(card&&!S.ui.selMode&&!S.ui.selection.size){const t=task(card.dataset.id);
if(!t||!canEdit(t.projectId))return;if(grip)e.preventDefault();
beginDrag(e,card,{mode:'card',item:'.card',sidebar:true,rot:1.3,drop:commitCardDrop});return}
const row=e.target.closest('#rows .trow');
if(row&&!S.ui.selMode&&!S.ui.selection.size){const t=task(row.dataset.id);
if(!t||!canEdit(t.projectId))return;
const reorder=S.ui.view==='backlog'&&S.ui.sort==='manual'&&!S.ui.query;
if(grip)e.preventDefault();
beginDrag(e,row,{mode:'list',item:'.trow',container:$('#rows'),sidebar:true,reorder,scroller:$('#main'),rot:.8,drop:commitBacklogDrop})}
});
document.addEventListener('pointerover',e=>{
if(e.pointerType==='touch')return;
const it=e.target.closest&&e.target.closest('.rail-item');
if(it&&railActive()){if(tipFor!==it)showTip(it)}
else if(tipFor&&!(e.target.closest&&e.target.closest('#railTip')))hideTip()});
document.addEventListener('pointerout',e=>{
const it=e.target.closest&&e.target.closest('.rail-item');
if(it&&!(e.relatedTarget&&it.contains(e.relatedTarget)))hideTip()});
document.addEventListener('focusin',e=>{const it=e.target.closest&&e.target.closest('.rail-item');if(it&&railActive())showTip(it)});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('.rail-item'))hideTip()});
$('#sideNav').addEventListener('scroll',hideTip,{passive:true});
$('#main').addEventListener('scroll',()=>{if(popKind&&!dragState&&!popPoint)closePop()},{passive:true});
let wasMobile=innerWidth<=900;
addEventListener('resize',()=>{
if(popKind)closePop();hideTip();
if(S.ui.drawerId)applyDrawerMode();
const mob=innerWidth<=900;
if(mob!==wasMobile){wasMobile=mob;renderSidebar()}});

/* ---------- boot ---------- */
async function boot(){
const t0=performance.now(),ok=await dbOpen();
if(ok){
const arr=await Promise.all(STORES.map(dbAll));
S.users=arr[0]||[];S.teams=arr[1]||[];S.projects=(arr[2]||[]).map(p=>Object.assign({teams:[],members:[]},p));
S.boards=arr[3]||[];S.columns=(arr[4]||[]).map(c=>Object.assign({kind:null,locked:false},c));
S.tasks=(arr[5]||[]).map(t=>Object.assign(mkTask({}),t,{parentId:t.parentId||null,color:t.color||null,colorAlpha:t.colorAlpha??.2}));
S.sprints=arr[6]||[];S.labels=arr[7]||[];S.views=arr[8]||[];
const mm={};(arr[9]||[]).forEach(m=>mm[m.key]=m.value);
if(!mm.seeded||!S.projects.length){S.users=[];S.teams=[];S.projects=[];S.boards=[];S.columns=[];S.tasks=[];S.sprints=[];S.labels=[];S.views=[];seed();await persistSeed()}
ensureSystemColumns();normalizeChildren();
const pr=mm.prefs;
if(pr){prefs.theme=pr.theme==='light'?'light':'dark';prefs.sound=pr.sound!==false;prefs.rail=!!pr.rail;
if(pr.userId&&user(pr.userId))prefs.userId=pr.userId;
S.ui.density=pr.density==='compact'?'compact':'cozy';
S.ui.drawerMode=['side','wide','full'].includes(pr.drawerMode)?pr.drawerMode:'side';
S.ui.mdMode=['edit','split','preview'].includes(pr.mdMode)?pr.mdMode:'split';
if(['manual','due','priority','title','created'].includes(pr.sort))S.ui.sort=pr.sort;
if(pr.view&&['board','backlog','my','teams','people','user'].includes(pr.view)){
S.ui.view=pr.view;S.ui.projectId=pr.projectId;S.ui.boardId=pr.boardId;S.ui.userId=pr.userId;
if(pr.view==='board'&&(!pr.projectId||!board(pr.boardId)))S.ui.view='my';
if(pr.view==='backlog'&&!pr.projectId)S.ui.view='my'}}
if(!prefs.userId||!user(prefs.userId))prefs.userId=S.users[0]?S.users[0].id:null;
if(S.ui.projectId&&!canView(S.ui.projectId))S.ui.view='my';
if(S.ui.projectId)S.ui.expanded.add(S.ui.projectId);
stat('saved');
}else{seed();ensureSystemColumns();normalizeChildren();stat('memory');setTimeout(()=>toast({msg:'IndexedDB недоступна — данные живут только в этой сессии',icon:'alert',tone:'warn'}),900)}
document.body.classList.toggle('rail',prefs.rail);
applyDrawerMode();applyTheme();renderAll();
const wait=Math.max(0,550-(performance.now()-t0));
setTimeout(()=>{document.body.classList.add('ready');const ld=$('#loader');ld.classList.add('hide');setTimeout(()=>ld.remove(),500)},wait);
}
boot();
})();
</script>
