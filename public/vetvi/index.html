<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ветви — конструктор нарратива</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='6' cy='12' r='4' fill='%23e2a54e'/%3E%3Ccircle cx='19' cy='5' r='3' fill='%239cb878'/%3E%3Ccircle cx='19' cy='19' r='3' fill='%23cf6d4f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d0f; --panel:#15171b; --card:#1e2127; --card2:#232730;
  --line:#2a2e36; --line2:#363b45; --tx:#e7e9ec; --tx2:#a6acb7; --tx3:#6d7480;
  --acc:#e2a54e; --acc2:#f0c179; --accd:rgba(226,165,78,.14);
  --ok:#8fbf7f; --warn:#d8c96f; --bad:#cf6b5a;
  --disp:'Unbounded',sans-serif; --body:'Golos Text',sans-serif; --mono:'JetBrains Mono',monospace;
  --sh:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--body);overflow:hidden;display:flex;flex-direction:column}
::selection{background:rgba(226,165,78,.3)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c313a;border-radius:8px;border:2px solid var(--panel)}
::-webkit-scrollbar-track{background:transparent}
kbd{font:600 10px var(--mono);background:#22262d;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--tx2)}
#topbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(#181a1f,#131519);border-bottom:1px solid #262a31;position:relative;z-index:40;animation:dropIn .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes dropIn{from{transform:translateY(-100%);opacity:0}}
.brand{display:flex;align-items:center;gap:10px;user-select:none;flex:none}
.brand svg{width:28px;height:28px}
.brand .lg{font:700 15px var(--disp);letter-spacing:3px;color:var(--tx)}
.brand .sub{font:600 8.5px var(--mono);letter-spacing:2px;color:var(--tx3);text-transform:uppercase;margin-top:3px}
#projName{flex:0 1 170px;min-width:60px;height:34px;background:transparent;border:1px solid transparent;border-radius:9px;color:var(--tx);font:600 13.5px var(--body);padding:0 10px;transition:.18s;text-overflow:ellipsis}
#projName:hover{border-color:var(--line2)}
#projName:focus{outline:none;border-color:var(--acc);background:#131519;box-shadow:0 0 0 3px var(--accd)}
.vsep{width:1px;height:24px;background:var(--line);flex:none}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--tx2);font:500 13px var(--body);cursor:pointer;transition:all .18s;position:relative;white-space:nowrap}
.btn:hover{background:#262b33;color:var(--tx);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.35);border-color:#3d434f}
.btn:active{transform:translateY(0) scale(.97)}
.btn svg{width:15px;height:15px;flex:none}
.btn.primary{background:linear-gradient(180deg,#eab264,#d69637);border-color:#a97a2e;color:#221604;font-weight:600;overflow:hidden}
.btn.primary::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-120%);transition:transform .55s}
.btn.primary:hover{filter:brightness(1.07);color:#221604}
.btn.primary:hover::after{transform:translateX(120%)}
.btn.danger{border-color:#4a2f2b;color:#e0937f}
.btn.danger:hover{background:rgba(207,107,90,.13);color:#f0a791;border-color:#6b3f38}
.btn.disabled{opacity:.35;pointer-events:none}
.ibtn{width:34px;padding:0;justify-content:center}
.ibtn.on{color:var(--acc);background:var(--accd);border-color:rgba(226,165,78,.4);box-shadow:inset 0 0 12px rgba(226,165,78,.08)}
#zPct{font:600 11px var(--mono);color:var(--tx3);width:46px;text-align:center;user-select:none}
.save-wrap{position:relative;display:inline-flex}
.save-wrap .btn.primary:first-child{border-radius:9px 0 0 9px}
.save-wrap .caret{width:24px;padding:4px;border-radius:0 9px 9px 0;margin-left:0px}
.save-wrap .caret svg{width:12px;height:12px;transition:transform .2s}
.save-wrap.open .caret svg{transform:rotate(180deg)}
.save-menu{position:absolute;top:calc(100% + 7px);left:0;min-width:250px;background:#1b1e24;border:1px solid #303540;border-radius:11px;padding:6px;box-shadow:var(--sh);display:none;z-index:60;transform-origin:top left;animation:ctxIn .15s cubic-bezier(.2,.9,.3,1.2)}
.save-menu.show{display:block}
.sm-i{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;font-size:12.5px;color:var(--tx2);cursor:pointer;transition:.12s}
.sm-i:hover{background:#262b33;color:var(--tx)}
.sm-i svg{width:14px;height:14px;color:var(--tx3)}
.sm-i kbd{margin-left:auto}
#layout{flex:1;display:flex;min-height:0}
aside{background:var(--panel);flex:none;display:flex;flex-direction:column;min-height:0}
#left{width:264px;border-right:1px solid var(--line);animation:slideL .55s .08s cubic-bezier(.2,.8,.3,1) both}
@keyframes slideL{from{transform:translateX(-24px);opacity:0}}
#right{width:302px;border-left:1px solid var(--line);animation:slideR .55s .08s cubic-bezier(.2,.8,.3,1) both;overflow-y:auto;padding:16px 16px 30px}
@keyframes slideR{from{transform:translateX(24px);opacity:0}}
.ltabs{display:flex;gap:4px;padding:10px 10px 0;border-bottom:1px solid var(--line);align-items:center}
.ltab{flex:1;height:34px;background:none;border:none;border-bottom:2px solid transparent;color:var(--tx3);font:600 12.5px var(--body);letter-spacing:.4px;cursor:pointer;transition:.18s;border-radius:8px 8px 0 0}
.ltab:hover{color:var(--tx2);background:rgba(255,255,255,.03)}
.ltab.active{color:var(--tx);border-bottom-color:var(--acc);background:linear-gradient(rgba(226,165,78,.07),transparent)}
.add-type{width:28px;height:28px;flex:none;margin:0 2px 5px 6px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--tx2);font:600 16px/1 var(--body);cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center}
.add-type:hover{color:#221604;background:linear-gradient(180deg,#eab264,#d69637);border-color:#a97a2e;transform:translateY(-1px) rotate(90deg)}
.tabpane{display:none;flex:1;overflow-y:auto;flex-direction:column}
.tabpane.active{display:flex}
.pal-hint{font-size:11px;color:var(--tx3);line-height:1.5;padding:12px 14px 2px}
.pal-hint b{color:var(--tx2)}
.pal-item{display:flex;align-items:center;gap:10px;margin:8px 10px 0;padding:9px 10px;border-radius:10px;cursor:grab;background:#191c21;border:1px solid #262a31;position:relative;transition:all .16s;user-select:none}
.pal-item::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--c);opacity:.85}
.pal-item:hover{transform:translateX(4px);background:#1e222a;border-color:#3a404b;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.pal-item:active{cursor:grabbing;transform:translateX(4px) scale(.98)}
.pal-item.custom{border-style:dashed;border-color:#4a5160}
.pal-item.custom:hover{border-color:var(--c)}
.pal-item.dim{opacity:.55}
.pal-item.dim:hover{opacity:.9}
.pal-item.cv-card.sel{border-color:rgba(226,165,78,.55);background:var(--accd)}
.pal-ico{width:30px;height:30px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--c);background:rgba(255,255,255,.05)}
.pal-ico svg{width:16px;height:16px}
.pal-name{flex:1;font-size:13px;font-weight:500;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-item:hover .pal-name{color:var(--tx)}
.cv-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cv-desc{font-size:10.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.pal-cnt{font:600 10.5px var(--mono);color:var(--tx3);background:#22262d;border-radius:6px;padding:2px 7px}
.pal-item:not(.cv-card):hover .pal-cnt{display:none}
.item-acts{display:none;gap:4px}
.pal-item:hover .item-acts{display:flex}
.mini-btn{width:22px;height:22px;border-radius:6px;border:none;background:#262b33;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex:none}
.mini-btn:hover{color:var(--tx);background:#333a45;transform:scale(1.1)}
.mini-btn.del:hover{color:#f0a791;background:rgba(207,107,90,.18)}
.mini-btn.eye{background:none}
.mini-btn.eye:hover{color:var(--acc2);background:#262b33}
.mini-btn.eye.off{color:#5a5f69}
.pal-sep{display:flex;align-items:center;gap:8px;margin:20px 12px 2px;color:var(--tx3);font:600 9.5px var(--mono);letter-spacing:1.8px;text-transform:uppercase}
.pal-sep::before,.pal-sep::after{content:'';height:1px;background:var(--line);flex:1}
.pal-group{display:flex;align-items:center;gap:7px;font:600 10px var(--mono);color:var(--tx3);letter-spacing:1px;margin:14px 14px 0;text-transform:uppercase}
.pal-group.foldable{cursor:pointer;user-select:none;padding:3px 0;transition:color .15s}
.pal-group.foldable:hover{color:var(--tx2)}
.pal-group .dot{width:7px;height:7px;border-radius:50%;flex:none}
.pg-chev{display:flex;transition:transform .25s cubic-bezier(.3,1.3,.4,1)}
.pal-group.folded .pg-chev{transform:rotate(-90deg)}
.pg-cnt{margin-left:auto;font:600 9px var(--mono);color:var(--tx3);background:#22262d;border-radius:5px;padding:1px 6px}
.search{margin:10px;position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--tx3);pointer-events:none}
.search input{width:100%;height:34px;background:#14161a;border:1px solid #2b2f37;border-radius:9px;color:var(--tx);font:13px var(--body);padding:0 10px 0 32px;transition:.18s}
.search input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accd)}
#nodeList{padding:0 10px 16px}
.nli{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;transition:.14s;border:1px solid transparent}
.nli:hover{background:#1d2127;transform:translateX(2px)}
.nli.sel{background:var(--accd);border-color:rgba(226,165,78,.35)}
.nli .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.nli .t{flex:1;font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nli.sel .t{color:var(--tx)}
.nli .k{font:10px var(--mono);color:var(--tx3)}
.nli.grp{margin-top:8px;background:rgba(255,255,255,.02)}
.nli.grp .t{color:var(--tx);font-weight:600}
.nli.grp .dot{border-radius:3px}
.nli.grp .garr{color:var(--tx3);display:flex;flex:none}
.ov-f{width:18px;height:18px;flex:none;border:none;background:none;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:5px;transition:transform .2s,color .15s}
.ov-f:hover{color:var(--tx)}
.ov-f.folded{transform:rotate(-90deg)}
.list-empty{font-size:12px;color:var(--tx3);text-align:center;padding:24px 10px}
#stage{flex:1;position:relative;min-width:0}
#canvas{position:absolute;inset:0;overflow:hidden;background-color:var(--bg);touch-action:none;background-image:radial-gradient(circle,#22252b 1px,transparent 1.3px)}
#canvas.dropready{outline:2px dashed rgba(226,165,78,.35);outline-offset:-10px}
body.space #canvas,body.ctrlpan #canvas{cursor:grab}
body.panning #canvas,body.panning .groupbox,body.panning .gcard,body.panning .node{cursor:grabbing!important}
#lockTip{position:fixed;z-index:400;left:0;top:0;transform:translate(-50%,-150%);background:rgba(26,28,33,.97);border:1px solid #6a4a3a;border-radius:9px;padding:7px 13px;font:600 12px var(--body);color:#f4d9b8;white-space:nowrap;box-shadow:0 10px 28px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .16s;display:flex;align-items:center;gap:8px}
#lockTip.show{opacity:1}
#lockTip .lt-dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.gbadge.lbadge{border-style:solid;font-weight:700}
/* обводка объектов, которые прямо сейчас редактирует другой участник (цветом участника) */
.node.lkb{border-color:var(--lkc,#8b929c)!important;box-shadow:0 0 0 1.5px var(--lkc,#8b929c),0 0 18px -4px var(--lkc,#8b929c),0 6px 18px rgba(0,0,0,.38)!important}
.groupbox.lkb,.gcard.lkb{border-color:var(--lkc,#8b929c)!important;border-style:solid!important;box-shadow:0 0 0 2px var(--lkc,#8b929c),0 0 24px -6px var(--lkc,#8b929c)!important}
#edges .edge.lkb .line{stroke:var(--lkc,#8b929c)!important;filter:drop-shadow(0 0 5px var(--lkc,#8b929c))}
/* список проектов */
.pj-list{max-height:340px;overflow-y:auto;margin:10px 0 4px;display:flex;flex-direction:column;gap:6px}
.pj-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid #262a31;border-radius:10px;background:#191c21;cursor:pointer;transition:all .15s}
.pj-row:hover{background:#1e222a;border-color:#3a404b}
.pj-row.cur{border-color:rgba(226,165,78,.45);background:rgba(226,165,78,.08)}
.pj-main{flex:1;min-width:0}
.pj-name{font:600 13px var(--body);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-meta{font:500 11px var(--body);color:var(--tx3);margin-top:2px}
.pj-badge{font:600 10px var(--mono);color:#7fb5a2;border:1px solid rgba(127,181,162,.4);border-radius:5px;padding:1px 6px;flex:none}
.pj-acts{display:flex;gap:4px;flex:none}
.pj-ib{width:28px;height:28px;border:none;border-radius:7px;background:none;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pj-ib:hover{background:#262b33;color:var(--tx)}
.pj-ib.danger:hover{color:#e08a7a;background:rgba(207,107,90,.12)}
.pj-empty{font-size:12px;color:var(--tx3);text-align:center;padding:18px 10px}
.pj-foot{display:flex;gap:8px;margin-top:10px}
body.knife #canvas{cursor:crosshair}
body.carry #canvas{cursor:copy}
#canvas::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(900px 560px at 55% 38%,rgba(226,165,78,.045),transparent 65%),radial-gradient(140% 120% at 50% 120%,rgba(0,0,0,.5),transparent 55%)}
#canvas.animv{transition:background-position .45s cubic-bezier(.2,.7,.2,1),background-size .45s cubic-bezier(.2,.7,.2,1)}
#canvas.nogrid{background-image:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;z-index:2}
#world.animv{transition:transform .45s cubic-bezier(.2,.7,.2,1)}
#framesLayer{position:absolute;left:0;top:0}
#labels{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
#labels.animv .gbadge{transition:left .45s cubic-bezier(.2,.7,.2,1),top .45s cubic-bezier(.2,.7,.2,1)}
.gbadge{position:absolute;transform:translate(-50%,-100%);background:rgba(24,26,31,.92);border:1px solid;border-radius:7px;padding:2px 9px;font:600 10.5px var(--body);letter-spacing:.3px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges .edge{pointer-events:none}
#edges .edge .hit{fill:none;stroke:#000;stroke-opacity:0;stroke-width:16;pointer-events:stroke;cursor:pointer}
#edges .edge .line{fill:none;stroke:#575d68;stroke-width:2;marker-end:url(#arw);transition:stroke .15s}
#edges .edge:hover .line{stroke:#8f97a3;stroke-width:2.4;marker-end:url(#arwHi)}
#edges .edge.sel .line{stroke:var(--acc);stroke-width:2.4;marker-end:url(#arwSel);filter:drop-shadow(0 0 6px rgba(226,165,78,.55))}
#edges .edge.drop-target .line{stroke:var(--acc2);stroke-width:3.2;marker-end:url(#arwSel);filter:drop-shadow(0 0 8px rgba(226,165,78,.75))}
#edges .edge.kind-choice .line{stroke-dasharray:7 5}
#edges .edge.kind-cond .line{stroke-dasharray:2 5;stroke-linecap:round}
#edges .edge.bridge .line{stroke-width:6;stroke:#79808d;marker-end:url(#arwBridge)}
#edges .edge.bridge:hover .line{stroke:#a6adb8;marker-end:url(#arwBridgeHi)}
#edges .edge.bridge.sel .line{stroke:var(--acc);marker-end:url(#arwBridgeSel);filter:drop-shadow(0 0 6px rgba(226,165,78,.45))}
#edges .edge.bridge .hit{stroke-width:26}
#edges .edge.bridge .ep-h{display:none}
#edges .edge.sel.kind-choice .line,#edges .edge.sel.kind-cond .line,#edges .edge.drop-target .line{animation:dashmove .8s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-12}}
#edges .elabel{font:600 10.5px var(--mono);fill:#99a0ab;text-anchor:middle;paint-order:stroke;stroke:#0c0d0f;stroke-width:4px;pointer-events:auto;cursor:grab;transition:fill .15s}
#edges .elabel-hit{font:600 10.5px var(--mono);fill:none;stroke:rgba(0,0,0,0);stroke-width:16;text-anchor:middle;pointer-events:stroke;cursor:grab}
#edges .edge.sel .elabel{fill:var(--acc2)}
#edges circle.wp{fill:#1d2027;stroke:#8f97a3;stroke-width:2;pointer-events:auto;cursor:grab;transition:stroke .15s}
#edges .edge:hover circle.wp{stroke:#c9cfd8}
#edges .edge.sel circle.wp{stroke:var(--acc);fill:#2a2113}
#edges circle.ep-h{fill:var(--acc);stroke:#0c0d0f;stroke-width:1.5;pointer-events:auto;cursor:crosshair;opacity:0;transition:opacity .15s}
#edges .edge:hover circle.ep-h{opacity:.85}
#edges .edge.sel circle.ep-h{opacity:1}
#edges .edge.spawn .line{stroke-dasharray:1;stroke-dashoffset:1;animation:drawE .55s cubic-bezier(.3,.7,.3,1) forwards}
#edges .edge.spawn .elabel{opacity:0;animation:fadeI .35s .45s forwards}
@keyframes drawE{to{stroke-dashoffset:0}}
@keyframes fadeI{to{opacity:1}}
#edges path.preview{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:6 6;animation:dashmove .6s linear infinite;filter:drop-shadow(0 0 5px rgba(226,165,78,.5));marker-end:url(#arwSel)}
#edges path.cutline{fill:none;stroke:var(--bad);stroke-width:2;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;filter:drop-shadow(0 0 6px rgba(207,107,90,.6));animation:dashmove .5s linear infinite}
#marquee{position:absolute;border:1px solid var(--acc);background:rgba(226,165,78,.09);border-radius:4px;pointer-events:none;z-index:6;display:none}
#marquee.mg{border-color:#9cb878;background:rgba(156,184,120,.12);border-width:1.5px}
#emptyHint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none;z-index:3;opacity:0;transition:opacity .4s}
#emptyHint.show{opacity:1}
#emptyHint .ring{width:64px;height:64px;border:2px dashed var(--line2);border-radius:18px;animation:spinSlow 14s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
#emptyHint p{color:var(--tx3);font-size:13px}
body.dropping .port{opacity:1}
body.dropping .pout::after{border-color:var(--acc);box-shadow:0 0 9px rgba(226,165,78,.6);animation:pulseDot 1.2s ease-in-out infinite}
.groupbox{position:absolute;border:1.5px dashed var(--gbcol,rgba(160,168,180,.4));background:var(--gbfill,transparent);border-radius:14px;cursor:default;transition:border-color .18s,box-shadow .18s}
.groupbox:hover{border-color:var(--gbhov,rgba(195,203,215,.6))}
.groupbox.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--accd)}
.groupbox.drop-hover-g,.gcard.drop-hover-g{border-color:var(--acc2)!important;box-shadow:0 0 0 4px rgba(240,193,121,.25)!important}
.gb-head{position:absolute;top:-13px;left:10px;display:flex;align-items:center;gap:7px;background:#1d2027;border:1px solid #343945;border-radius:8px;padding:3px 8px;box-shadow:0 4px 10px rgba(0,0,0,.35);cursor:grab;z-index:4;max-width:90%}
.groupbox.sel .gb-head,.gcard.sel .gb-head{border-color:var(--acc)}
.gb-name{font-size:11.5px;font-weight:600;color:var(--tx);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.gb-cnt{font:600 9px var(--mono);color:var(--tx3);background:#262a31;padding:1px 6px;border-radius:5px;flex:none}
.gb-fold{width:16px;height:16px;flex:none;border:none;background:none;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:5px;transition:.15s}
.gb-fold:hover{color:var(--acc);background:#2b303a;transform:scale(1.15)}
.gb-grip{position:absolute;width:14px;height:14px;border-radius:3px;background:#2b303a;border:1px solid #454b57;opacity:0;transition:.15s;z-index:5}
.groupbox:hover .gb-grip,.groupbox.sel .gb-grip{opacity:1}
.gb-grip:hover{background:var(--acc);border-color:#a97a2e}
.gr-r{right:-7px;top:50%;margin-top:-7px;cursor:ew-resize}
.gr-b{left:50%;bottom:-7px;margin-left:-7px;cursor:ns-resize}
.gr-br{right:-7px;bottom:-7px;cursor:nwse-resize}
.gcard{position:absolute;width:200px;background:linear-gradient(#21252d,#191c21);border:1.5px dashed var(--gbcol,var(--line2));border-radius:12px;cursor:grab;box-shadow:0 8px 22px rgba(0,0,0,.45);transition:transform .16s,box-shadow .16s,border-color .16s;user-select:none}
.gcard:hover{transform:translateY(-2px);border-color:var(--gbhov,#4a5160);box-shadow:0 12px 28px rgba(0,0,0,.55)}
.gcard.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--accd),0 10px 26px rgba(0,0,0,.5)}
.gcard .gb-head{position:static;border:none;background:none;box-shadow:none;padding:9px 10px;max-width:none}
.gcard.spawn{animation:nodeIn .5s cubic-bezier(.2,.9,.3,1.15) both}
.gb-list{padding:2px 10px 9px;display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line)}
.gc-row{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--tx2);padding:3px 12px;border-radius:6px;background:rgba(255,255,255,.025);position:relative}
.gc-row .dot{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
.gc-row .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-row.sub{color:var(--tx3)}
.gc-pin{position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#0f1114;border:2px solid #565c66;pointer-events:none;flex:none}
.gc-pin.in{left:-5px}.gc-pin.out{right:-5px}
.node{position:absolute;background:linear-gradient(#20242b,#191c21);border:1px solid #31363f;border-radius:11px;box-shadow:0 6px 18px rgba(0,0,0,.38);cursor:grab;user-select:none;transition:transform .16s,box-shadow .16s,border-color .16s}
.node:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.5);border-color:#404653}
.node.dragging{cursor:grabbing;box-shadow:0 18px 38px rgba(0,0,0,.6)}
.node::before{content:'';position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--c)}
.node.spawn{animation:nodeIn .5s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes nodeIn{0%{opacity:0;transform:scale(.8) translateY(10px)}65%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
.node.sel{border-color:#4c515c}
.node.sel::after{content:'';position:absolute;inset:-6px;border:1.5px solid var(--acc);border-radius:15px;pointer-events:none;animation:ringPulse 1.8s ease-in-out infinite}
@keyframes ringPulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.35;transform:scale(1.02)}}
.node.drop-hover{border-color:var(--acc);box-shadow:0 0 0 4px var(--accd),0 12px 26px rgba(0,0,0,.5)}
.n-head{display:flex;align-items:center;gap:7px;padding:9px 8px 7px 13px}
.n-ico{color:var(--c);display:flex;flex:none}
.n-ico svg{width:15px;height:15px}
.n-title{flex:1;font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-reply-cnt{font:600 10px var(--mono);color:var(--tx3);background:#262a31;padding:1px 6px;border-radius:5px;flex:none;margin-left:4px}
.n-title-inp{flex:1;min-width:0;height:24px;background:#101216;border:1px solid var(--acc);border-radius:5px;color:var(--tx);font:600 12.5px var(--body);padding:0 6px;outline:none}
.n-st{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 7px currentColor;background:currentColor}
.n-st.st-idea{color:var(--warn)}.n-st.st-draft{color:#8f96a2}.n-st.st-done{color:var(--ok)}
.n-fold{width:20px;height:20px;flex:none;border:none;background:none;color:var(--tx3);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s}
.n-fold:hover{color:var(--acc);background:#2b303a;transform:scale(1.12)}
.n-fold svg{width:12px;height:12px}
.n-body{padding:0 12px 11px 14px}
.node.ex-0 .n-text{display:none}
.node.ex-0 .dlg-tree{display:none}
.dlg-collapse-out{display:none;align-items:center;gap:7px;padding:4px 10px;border-radius:6px;background:rgba(226,165,78,.10);box-shadow:inset 0 0 0 1px rgba(226,165,78,.45);position:relative;margin-top:6px;font-size:11px;font-weight:600;color:var(--tx2)}
.node.ex-0 .dlg-collapse-out.has-any{display:flex}
.dlg-collapse-pin{position:absolute;top:50%;right:-5px;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#2a2113;border:2px solid var(--acc);box-shadow:0 0 6px rgba(226,165,78,.5);pointer-events:none}
.n-text{font-size:12px;color:var(--tx2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node.ex-2 .n-text{display:block;-webkit-line-clamp:unset;overflow:visible}
.n-text.empty{color:var(--tx3);font-style:italic}
.n-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.node.ex-0 .n-tags{margin-top:1px;margin-bottom:1px}
.n-tags span{font:600 9.5px var(--mono);letter-spacing:.4px;color:var(--tx3);background:#232730;border:1px solid #303540;border-radius:6px;padding:2px 7px}
.port{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;background:transparent;border:none;z-index:4;opacity:0;transition:opacity .18s}
.port::after{content:'';position:absolute;inset:7px;border-radius:50%;background:#0f1114;border:2px solid #565c66;transition:all .18s}
.pin{left:-13px;cursor:crosshair}
.pout{right:-13px;cursor:grab}
.node:hover .port,.node.sel .port,body.connecting .port,body.dropping .port{opacity:1}
.port:hover::after{border-color:var(--acc);background:#2a2113;transform:scale(1.25);box-shadow:0 0 10px rgba(226,165,78,.5)}
.node.t-dialog .pout{top:auto;bottom:8px;right:-13px;left:auto;margin-top:0}
.node.t-dialog .n-body{padding-bottom:34px}
.dlg-tree{margin-top:8px;padding:4px 0}
.dlg-empty{color:var(--tx3);font-style:italic;text-align:center;padding:12px 4px;font-size:10.5px}
.dlg-participants{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dlg-participant{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.2px}
.dlg-replies{margin-top:6px}
.dlg-reply-row{display:flex;align-items:center;gap:7px;padding:3px 10px;border-radius:6px;background:rgba(255,255,255,.025);position:relative;margin:2px 0;border:1px solid transparent;transition:background .15s,box-shadow .15s}
.dlg-reply-row .dot{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
.dlg-reply-row .t{flex:1;min-width:0;font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.dlg-reply-row .t .speaker{font-weight:700;margin-right:3px}
.node.ex-2 .dlg-reply-row{align-items:flex-start}
.node.ex-2 .dlg-reply-row .t{white-space:normal;overflow:visible;text-overflow:clip}
.node.ex-2 .dlg-reply-row .dot{margin-top:6px}
.dlg-reply-row.has-out{background:rgba(226,165,78,.10);box-shadow:inset 0 0 0 1px rgba(226,165,78,.45)}
.dlg-reply-row.src-hl{background:rgba(240,193,121,.14);box-shadow:inset 0 0 0 1px var(--acc2)}
.dlg-reply-row.src-sel{background:rgba(226,165,78,.16);box-shadow:inset 0 0 0 1.5px var(--acc)}
.dlg-reply-pin{position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#0f1114;border:2px solid #565c66;flex:none;opacity:0;transition:opacity .15s,border-color .15s,background .15s}
.node:hover .dlg-reply-pin,.node.sel .dlg-reply-pin{opacity:1}
.dlg-reply-pin.out{right:-5px;cursor:grab}
.dlg-reply-pin.out.live{opacity:1;border-color:var(--acc);background:#2a2113;box-shadow:0 0 6px rgba(226,165,78,.5)}
.dlg-reply-pin.out:hover{border-color:var(--acc2);background:#2a2113;transform:scale(1.3);box-shadow:0 0 10px rgba(226,165,78,.6)}
.dlg-children{margin-left:9px;padding-left:14px;position:relative;margin-top:3px}
.dlg-item{position:relative}
.dlg-reply-row::before{content:'';position:absolute;left:-14px;top:50%;width:12px;height:2px;margin-top:-1px;background:#4a5160;border-radius:1px}
.dlg-item:last-child>.dlg-reply-row::before{display:none}
.dlg-children>.dlg-item::after{content:'';position:absolute;left:-14px;top:-3px;bottom:-3px;width:2px;background:#4a5160;border-radius:1px}
.dlg-children>.dlg-item:first-child::after{top:-7px}
.dlg-children>.dlg-item:last-child::after{bottom:auto;top:-3px;height:var(--lk,16px);width:12px;background:transparent;border-left:2px solid #4a5160;border-bottom:2px solid #4a5160;border-bottom-left-radius:6px}
.dlg-children>.dlg-item:first-child:last-child::after{top:-7px}
.dlg-modal{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:rgba(6,7,9,.7)}
.dlg-modal.show{display:flex}
.dlg-modal-card{background:#1a1d22;border:1px solid #2e333c;border-radius:15px;box-shadow:var(--sh);min-width:420px;max-width:85vw;max-height:85vh;display:flex;flex-direction:column;animation:mIn .28s cubic-bezier(.2,.9,.3,1.2)}
.dlg-modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-modal-title{font:600 15px var(--body)}
.dlg-modal-close{width:28px;height:28px;border:none;background:none;color:var(--tx3);font-size:20px;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center}
.dlg-modal-close:hover{background:#262b33;color:var(--tx)}
.dlg-modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.dlg-modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.dlg-reply-ed{position:relative;padding:6px 6px 6px 16px;margin:3px 0;background:rgba(255,255,255,.02);border-radius:7px;border:1px solid transparent;transition:border-color .15s}
.dlg-reply-ed::before{content:'';position:absolute;left:4px;top:0;bottom:0;width:1.5px;background:var(--line2);border-radius:1px}
.dlg-reply-ed::after{content:'';position:absolute;left:4px;top:12px;width:8px;height:1.5px;background:var(--line2);border-radius:1px}
.dlg-reply-ed.root{padding-left:6px}
.dlg-reply-ed.root::before,.dlg-reply-ed.root::after{display:none}
.dlg-reply-ed:hover{border-color:var(--line2)}
.dlg-reply-row-ed{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.dlg-reply-row-ed select{flex:0 0 auto;width:auto;min-width:90px;height:26px;font-size:11px;padding:0 6px;background:#1a1d22;border:1px solid var(--line2);border-radius:5px;color:var(--tx)}
.dlg-reply-row-ed textarea{flex:1;min-height:32px;max-height:120px;resize:vertical;font-size:11.5px;line-height:1.45;padding:5px 8px;background:#1a1d22;border:1px solid var(--line2);border-radius:5px;color:var(--tx);font-family:var(--body)}
.dlg-reply-row-ed textarea:focus{outline:none;border-color:var(--acc)}
.dlg-reply-acts{display:flex;gap:4px;justify-content:flex-end;margin-top:3px}
.dlg-reply-acts .mini-btn{width:20px;height:20px}
.dlg-children-ed{margin-left:12px;padding-left:6px;border-left:1px dashed var(--line)}
.dlg-drag{cursor:grab;margin-right:auto}
.dlg-drag:active{cursor:grabbing}
.dlg-reply-ed.dragging{opacity:.45;border-color:var(--acc)!important}
.dlg-reply-ed.drop-above{box-shadow:inset 0 2px 0 var(--acc)}
.dlg-reply-ed.drop-below{box-shadow:inset 0 -2px 0 var(--acc)}
.dlg-add-root-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;background:#262b33;color:var(--tx2);border:1px solid var(--line2);cursor:pointer;transition:.15s}
.dlg-add-root-btn:hover{background:#333a45;color:var(--tx)}
.dlg-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;margin:3px 6px 3px 0;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.2px;border:1px solid transparent}
.dlg-chip .x{width:16px;height:16px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.65;transition:.15s}
.dlg-chip .x:hover{opacity:1;background:rgba(0,0,0,.3)}
.i-cap{font:600 10px var(--mono);letter-spacing:2px;color:var(--tx3);text-transform:uppercase;margin:0 0 10px;white-space:nowrap}
.i-lab{display:block;font-size:11px;color:var(--tx3);margin:14px 0 5px;letter-spacing:.3px}
.inp{width:100%;background:#14161a;border:1px solid #2b2f37;border-radius:8px;color:var(--tx);font:13px var(--body);padding:0 10px;height:34px;transition:.18s}
textarea.inp{height:auto;min-height:110px;padding:9px 10px;resize:vertical;line-height:1.55}
.inp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accd)}
select.inp{cursor:pointer}
input[type=range].inp{padding:0;height:26px;accent-color:var(--acc);background:transparent;border:none;box-shadow:none}
.chk{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--tx2);margin-top:14px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc);width:15px;height:15px;cursor:pointer}
.i-typehead{display:flex;gap:9px;align-items:center}
.i-typeico{width:38px;height:38px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center}
.i-typeico svg{width:18px;height:18px}
.seg{display:flex;gap:3px;background:#14161a;border:1px solid #2b2f37;border-radius:9px;padding:3px}
.seg button{flex:1;height:28px;border:none;border-radius:7px;background:none;color:var(--tx3);font:500 12px var(--body);cursor:pointer;transition:.15s}
.seg button:hover{color:var(--tx2)}
.seg button.on{background:#2a2f38;color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.seg button.on.c-idea{color:var(--warn)}.seg button.on.c-draft{color:#c8cdd6}.seg button.on.c-done{color:var(--ok)}
.i-meta{font:10.5px var(--mono);color:var(--tx3);margin-top:16px;line-height:1.8;word-break:break-all}
.i-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.i-actions .btn{flex:1;justify-content:center;padding:0 8px}
.i-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 6px;gap:12px}
.i-empty .ghost{width:58px;height:58px;border:2px dashed var(--line2);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--tx3);animation:floaty 3.5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.i-empty h3{font:600 14px var(--body)}
.i-empty p{font-size:12px;color:var(--tx3);line-height:1.6}
.ovgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%;margin-top:10px}
.ovcell{display:flex;align-items:center;gap:8px;background:#181b20;border:1px solid #262a31;border-radius:9px;padding:8px 10px;transition:.15s}
.ovcell:hover{border-color:#363c47;transform:translateY(-1px)}
.ovcell .d{width:7px;height:7px;border-radius:50%;flex:none}
.ovcell .n{flex:1;font-size:11.5px;color:var(--tx2);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovcell .c{font:600 11px var(--mono);color:var(--tx3)}
.ovmeta{width:100%;font:10.5px var(--mono);color:var(--tx3);margin-top:8px;line-height:2}
.gm-list{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;background:#14161a;border:1px solid #2b2f37;border-radius:9px;padding:6px}
.gm-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);padding:4px 6px;border-radius:6px;white-space:nowrap;overflow:hidden}
.gm-row .dot{width:7px;height:7px;border-radius:50%;flex:none}
.grp-row{display:flex;gap:8px;margin-top:14px}
.grp-row .inp{flex:1}
#status{height:32px;flex:none;display:flex;align-items:center;gap:18px;padding:0 14px;background:#101114;border-top:1px solid var(--line);font:11px var(--mono);color:var(--tx3);z-index:40;position:relative}
.st-left{display:flex;align-items:center;gap:8px;min-width:0}
#stFile{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;color:var(--tx2)}
#stDirty{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none;opacity:0;transition:.3s}
#stDirty.show{opacity:1;animation:pulseDot 1.6s ease-in-out infinite}
@keyframes pulseDot{50%{box-shadow:0 0 0 4px rgba(226,165,78,.18)}}
.st-mid{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-right{display:flex;gap:16px;align-items:center}
#stAuto{color:var(--ok);opacity:0;transition:opacity .4s}
#stAuto.flash{opacity:1}
#toasts{position:fixed;right:16px;bottom:44px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{display:flex;align-items:center;gap:9px;background:#1d2027;border:1px solid #32363f;border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--tx2);box-shadow:var(--sh);animation:tIn .3s cubic-bezier(.2,.9,.3,1.2) both;max-width:340px}
.toast.out{animation:tOut .3s forwards}
.toast .td{width:8px;height:8px;border-radius:50%;flex:none}
.toast.ok .td{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.toast.warn .td{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.toast.err .td{background:var(--bad);box-shadow:0 0 8px var(--bad)}
@keyframes tIn{from{transform:translateX(40px);opacity:0}}
@keyframes tOut{to{transform:translateX(40px);opacity:0}}
#ctx{position:fixed;z-index:95;min-width:196px;max-height:360px;overflow-y:auto;background:#1b1e24;border:1px solid #303540;border-radius:11px;padding:6px;box-shadow:var(--sh);display:none;transform-origin:top left;animation:ctxIn .15s cubic-bezier(.2,.9,.3,1.2)}
#ctx.show{display:block}
@keyframes ctxIn{from{transform:scale(.9);opacity:0}}
.ctx-i{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;font-size:12.5px;color:var(--tx2);cursor:pointer;transition:.12s}
.ctx-i:hover{background:#262b33;color:var(--tx)}
.ctx-i svg{width:14px;height:14px;color:var(--tx3)}
.ctx-i .dot{width:8px;height:8px;border-radius:50%;flex:none}
.ctx-i.danger{color:#e0937f}
.ctx-h{font:600 9.5px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);padding:6px 10px 4px}
.ctx-sep{height:1px;background:var(--line);margin:5px 8px}
#modalWrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(6,7,9,.65)}
#modalWrap.show{display:flex;animation:fadeI .2s}
.m-card{width:min(440px,92vw);max-height:88vh;overflow-y:auto;background:#1a1d22;border:1px solid #2e333c;border-radius:15px;padding:22px;box-shadow:var(--sh);animation:mIn .28s cubic-bezier(.2,.9,.3,1.2)}
.m-card.wide{width:min(540px,94vw)}
@keyframes mIn{from{transform:scale(.92) translateY(10px);opacity:0}}
.m-card h3{font:600 15px var(--body);margin-bottom:10px}
.m-card p{font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:18px}
.m-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.klist{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px;color:var(--tx2);align-items:center;margin-bottom:18px}
.klist div:nth-child(odd){text-align:right}
.ico-cap{font:600 9.5px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);margin:6px 0 5px;white-space:nowrap}
.ico-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-height:190px;overflow-y:auto;padding:5px;background:#14161a;border:1px solid #2b2f37;border-radius:9px}
.ico-btn{height:32px;border-radius:7px;border:1px solid transparent;background:none;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.13s}
.ico-btn:hover{background:#232730;color:var(--tx);transform:scale(1.08)}
.ico-btn.on{border-color:var(--acc);color:var(--acc);background:var(--accd)}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.swatch{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:.15s}
.swatch:hover{transform:scale(1.15)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--acc)}
.swatch.reset{background:#14161a;border:1px dashed var(--line2);color:var(--tx3);display:flex;align-items:center;justify-content:center}
.swatch.reset:hover{color:var(--tx)}
.dst-win{position:fixed;z-index:105;display:none;min-width:160px;background:#1a1d22;border:1px solid #2e333c;border-radius:12px;box-shadow:var(--sh);flex-direction:column}
.dst-win.show{display:flex}
.dst-win-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:grab;user-select:none}
.dst-win-head:active{cursor:grabbing}
.dst-win-title{font:600 12px var(--body);color:var(--tx2)}
.dst-win-close{width:22px;height:22px;border:none;background:none;color:var(--tx3);font-size:16px;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center}
.dst-win-close:hover{background:#262b33;color:var(--tx)}
.dst-win-body{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 14px 12px}
.dst-val{width:64px;height:34px;text-align:center;background:#14161a;border:1px solid #2b2f37;border-radius:8px;color:var(--tx);font:600 18px var(--mono);outline:none}
.dst-val:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accd)}
.dst-hint{font-size:10.5px;color:var(--tx3)}
.node-notes{position:absolute;top:-20px;right:-1px;display:flex;gap:4px;z-index:6}
.node-note-ico{width:26px;height:26px;border-radius:8px;border:1px solid rgba(226,165,78,.5);background:#1d2027;color:var(--acc);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.45);transition:.15s;padding:0}
.node-note-ico:hover{transform:translateY(-2px) scale(1.08);background:var(--accd);border-color:var(--acc)}
.note-list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.note-row{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:7px;background:#181b20;border:1px solid #262a31;transition:.14s}
.note-row:hover{border-color:#363c47;background:#1d2127}
.note-row.hidden{opacity:.5}
.note-row-title{flex:1;min-width:0;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.note-row-title:hover{color:var(--acc2)}
.note-row-acts{display:flex;gap:3px;flex:none}
.note-empty{font-size:11px;color:var(--tx3);font-style:italic;padding:6px 2px}
.note-modal{position:fixed;inset:0;z-index:115;display:none;align-items:center;justify-content:center;background:rgba(6,7,9,.72)}
.note-modal.show{display:flex}
.note-modal-card{background:#1a1d22;border:1px solid #2e333c;border-radius:15px;box-shadow:var(--sh);width:min(640px,94vw);max-height:88vh;display:flex;flex-direction:column;animation:mIn .28s cubic-bezier(.2,.9,.3,1.2)}
.note-modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.note-modal-title{font:600 15px var(--body)}
.note-modal-close{width:28px;height:28px;border:none;background:none;color:var(--tx3);font-size:20px;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center}
.note-modal-close:hover{background:#262b33;color:var(--tx)}
.note-modal-body{padding:14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.note-toolbar{display:flex;flex-wrap:wrap;gap:4px}
.note-tb{min-width:30px;height:30px;padding:0 8px;border-radius:7px;border:1px solid var(--line2);background:var(--card);color:var(--tx2);font:600 13px var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.14s}
.note-tb:hover{background:#262b33;color:var(--tx);border-color:#3d434f}
.note-tb.b{font-weight:800}.note-tb.i{font-style:italic}.note-tb.s{text-decoration:line-through}
.note-editor{min-height:160px;max-height:46vh;overflow-y:auto;background:#14161a;border:1px solid #2b2f37;border-radius:9px;padding:10px 12px;color:var(--tx);font:13.5px/1.6 var(--body);outline:none}
.note-editor:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accd)}
.note-editor ol,.note-editor ul{padding-left:24px;margin:5px 0}
.note-editor li{margin:2px 0}
.note-editor b,.note-editor strong{font-weight:700;color:var(--tx)}
.note-editor i,.note-editor em{font-style:italic}
.note-editor strike,.note-editor del,.note-editor s{text-decoration:line-through;color:var(--tx3)}
.nc-row{display:flex;align-items:flex-start;gap:7px;margin:3px 0;padding:2px 0}
.nc-box{flex:none;width:18px;height:18px;margin-top:1px;border-radius:5px;border:1.5px solid var(--line2);background:#181b20;color:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.14s}
.nc-box:hover{border-color:var(--acc)}
.nc-row[data-checked="1"] .nc-box{background:var(--acc);border-color:var(--acc);color:#221604}
.nc-txt{flex:1;min-width:0}
.nc-row.struck .nc-txt{text-decoration:line-through;color:var(--tx3)}
.note-view-body{background:#14161a;border:1px solid #2b2f37;border-radius:9px;padding:12px 14px;color:var(--tx);font:13.5px/1.65 var(--body);min-height:80px}
.note-view-body ol,.note-view-body ul{padding-left:24px;margin:5px 0}
.note-view-body li{margin:2px 0}
#miniMap{position:absolute;top:12px;right:12px;width:260px;height:180px;z-index:30;background:rgba(10,11,13,.88);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.5);overflow:visible;cursor:grab;touch-action:none}
#miniMap.mm-resizing{cursor:default}
#miniMap.mm-hidden{display:none}
#mmSvg{display:block;width:100%;height:100%;border-radius:9px;overflow:hidden}
#mmView{fill:none;stroke:var(--acc);stroke-width:1.5;pointer-events:none}
.mm-resize{position:absolute;left:-4px;bottom:-4px;width:16px;height:16px;cursor:nesw-resize;z-index:3;border-left:2px solid var(--line2);border-bottom:2px solid var(--line2);border-bottom-left-radius:10px;opacity:.45;transition:opacity .15s,border-color .15s}
#miniMap:hover .mm-resize{opacity:1}
.mm-resize:hover{border-color:var(--acc)}
/* ═══ коллаборация ═══ */
.collab-chip{gap:7px}
.cc-dot{width:9px;height:9px;border-radius:50%;background:#6d7480;flex:none;transition:background .2s}
.cc-dot.pulse{animation:ccPulse 1.1s infinite}
@keyframes ccPulse{50%{opacity:.3}}
.collab-chip.copy-mode{border-color:rgba(226,165,78,.55);color:var(--acc2);background:var(--accd)}
#collabPop{position:fixed;z-index:95;display:none;min-width:236px;background:#1b1e24;border:1px solid #303540;border-radius:12px;padding:8px;box-shadow:var(--sh)}
#collabPop.show{display:block;animation:ctxIn .16s cubic-bezier(.2,.9,.3,1.2)}
.cp-row{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;font-size:12.5px;color:var(--tx2)}
.cp-row.me{color:var(--tx)}
.cp-row .cp-dot{width:10px;height:10px;border-radius:50%;flex:none}
.cp-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-cap{font:600 9.5px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);padding:5px 9px 3px}
.cp-acts{display:flex;flex-direction:column;gap:2px;margin-top:6px;border-top:1px solid var(--line);padding-top:7px}
.cp-act{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:12.5px;color:var(--tx2);cursor:pointer;transition:.12s;background:none;border:none;text-align:left}
.cp-act:hover{background:#262b33;color:var(--tx)}
.m-badge{min-width:16px;height:16px;border-radius:8px;background:#cf6b5a;color:#fff;font:700 10px/16px var(--mono);text-align:center;padding:0 4px;margin-left:6px}
.mrg-item{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:#171a1f}
.mrg-top{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
.mrg-dot{width:10px;height:10px;border-radius:50%;flex:none}
.mrg-date{color:var(--tx3);font-size:11px}
.mrg-status{margin-left:auto;font:600 10.5px var(--mono);padding:2px 8px;border-radius:6px;background:#22262d;color:var(--tx2)}
.mrg-status.st-pending{background:rgba(216,201,111,.15);color:var(--warn)}
.mrg-status.st-applied{background:rgba(143,191,127,.15);color:var(--ok)}
.mrg-status.st-rejected{background:rgba(207,107,90,.15);color:var(--bad)}
.mrg-stats{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
.mrg-chip{font:500 11px var(--mono);background:#20242b;border:1px solid #2b303a;color:var(--tx2);border-radius:6px;padding:2px 7px}
.mrg-acts{display:flex;gap:8px;margin-top:9px}
.mrg-empty{color:var(--tx3);font-style:italic}
.cpy-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;margin-bottom:7px;background:#171a1f}
.cpy-item.active{border-color:rgba(226,165,78,.55);background:var(--accd)}
.cpy-name{flex:1;min-width:0}
.cpy-name b{display:block;color:var(--tx);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpy-meta{font-size:10.5px;color:var(--tx3)}
.cpy-row-btns{display:flex;gap:5px;flex:none}
.share-link{display:flex;gap:6px;margin:6px 0 4px}
.share-link input{flex:1;min-width:0;background:#14161a;border:1px solid #2b2f37;border-radius:9px;color:var(--tx);font:12px var(--mono);padding:8px 10px;outline:none}
.share-link input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accd)}
/* ── адаптив топбара ──
   ≤1500: у «Копии»/«Поделиться»/«Merge» остаётся только иконка (кнопка никогда не пустая),
   прячем второстепенное и уплотняем отступы — все кнопки полноразмерные. */
@media(max-width:1500px){
  #bCopies .t,#bShare .t,#bMerge .t{display:none}
  #bCopies,#bShare,#bMerge{padding:0 10px;justify-content:center}
  #topbar .btn{padding-left:10px;padding-right:10px}
  #zPct{display:none}
  .brand .sub{display:none}
  #topbar{gap:8px}
  #topbar .vsep{display:none}
}
/* ≤1430: одна строка уже не вмещает — переносим на две, кнопки никогда не сжимаются */
@media(max-width:1430px){
  #topbar{height:auto;min-height:56px;flex-wrap:wrap;padding:7px 10px;row-gap:7px}
  #projName{flex:1 1 120px}
}
@media(max-width:960px){
  #left{width:210px}
  #right{width:250px}
  #miniMap{width:170px;height:120px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none"><path d="M7.5 12h3c3.2 0 2.4-6.5 6-6.5M10.5 12c3.2 0 2.4 6.5 6 6.5" stroke="#4d535e" stroke-width="1.6" stroke-linecap="round"/><circle cx="5.5" cy="12" r="2.6" fill="#e2a54e"/><circle cx="18.5" cy="5.5" r="2.1" fill="#9cb878"/><circle cx="18.5" cy="18.5" r="2.1" fill="#cf6d4f"/></svg>
    <div><div class="lg">ВЕТВИ</div><div class="sub">конструктор нарратива</div></div>
  </div>
  <input id="projName" spellcheck="false" title="Название проекта">
  <div class="vsep"></div>
  <button class="btn" id="bNew" title="Новый проект">+ Новый</button>
  <button class="btn" id="bOpen" title="Открыть (Ctrl+O)">Открыть</button>
  <div class="save-wrap" id="saveWrap">
    <button class="btn primary" id="bSave" title="Сохранить (Ctrl+S)">Сохранить</button>
    <button class="btn primary caret" id="bSaveMenu" title="Варианты сохранения"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="save-menu" id="saveMenu">
      <div class="sm-i" data-a="json"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l4 4v14H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg>Сохранить (JSON)<kbd>Ctrl+S</kbd></div>
      <div class="sm-i" data-a="jsonas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l4 4v14H5z"/><path d="M8 3v5h7V3"/></svg>Сохранить как… (JSON)<kbd>Ctrl+Shift+S</kbd></div>
      <div class="sm-i" data-a="txt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h11v18l-2.8-2-2.7 2-2.7-2L6.5 21z"/><path d="M9.5 8.5h5M9.5 12h5"/></svg>Текстовый файл (.txt)</div>
    </div>
  </div>
  <div class="vsep"></div>
  <button class="btn ibtn" id="bUndo" title="Отменить (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5 3.5 9.5 8 14"/><path d="M4 9.5h10a6 6 0 1 1 0 12h-3"/></svg></button>
  <button class="btn ibtn" id="bRedo" title="Повторить (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5l4.5 4.5L16 14"/><path d="M20 9.5H10a6 6 0 1 0 0 12h3"/></svg></button>
  <div class="vsep"></div>
  <button class="btn ibtn" id="bZOut" title="Отдалить (−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <span id="zPct">100%</span>
  <button class="btn ibtn" id="bZIn" title="Приблизить (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="btn ibtn" id="bFit" title="Вписать всё (0)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <div class="vsep"></div>
  <button class="btn ibtn on" id="bGrid" title="Сетка"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 4h.01M12 4h.01M20 4h.01M4 12h.01M12 12h.01M20 12h.01M4 20h.01M12 20h.01M20 20h.01"/></svg></button>
  <button class="btn ibtn on" id="bSnap" title="Привязка к сетке"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v5a7 7 0 0 0 14 0V3"/><path d="M5 3h3v5H5zM16 3h3v5h-3z"/></svg></button><div class="vsep" style="margin:0 8px"></div><button class="btn ibtn on" id="bBendS" title="Изгиб всех стрелок: плавный"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 18c7 0 3-12 10-12h6"/></svg></button>
<button class="btn ibtn" id="bBend90" title="Изгиб всех стрелок: прямые углы (90°)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h9a3 3 0 0 0 3-3V6h4"/></svg></button>
<button class="btn ibtn" id="bBend45" title="Изгиб всех стрелок: углы 45°"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h6l8-8h2"/></svg></button><div class="vsep" style="margin:0 8px"></div><button class="btn ibtn on" id="bMap" title="Мини-карта"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="7" y="8" width="7" height="6" rx="1" fill="currentColor" fill-opacity=".3"/></svg></button><div class="vsep"></div>
  <button class="btn collab-chip" id="bCollab" title="Совместный доступ: статус и участники"><span class="cc-dot" id="ccDot"></span><span id="ccTxt">офлайн</span></button>
  <button class="btn" id="bMerge" title="Merge-запросы копий" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="2.6"/><circle cx="6" cy="6" r="2.6"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg><span class="t">Merge</span><span class="m-badge" id="mergeBadge" style="display:none">0</span></button>
  <button class="btn" id="bCopies" title="Локальные копии проекта"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span class="t">Копии</span></button>
  <button class="btn primary" id="bShare" title="Поделиться ссылкой на проект"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.4 13.4 7.2 4.2M15.6 6.4 8.4 10.6"/></svg><span class="t">Поделиться</span></button>
<div class="spacer"></div>
  <button class="btn ibtn" id="bHelp" title="Горячие клавиши">?</button>
</header>
<div id="layout">
  <aside id="left">
    <nav class="ltabs">
      <button class="ltab active" data-t="pal">Элементы</button>
      <button class="ltab" data-t="list">Обзор</button>
      <button class="add-type" id="bAddType" title="Создать свой тип элемента">+</button>
    </nav>
    <div class="tabpane active" id="panePal"><div id="palList"></div></div>
    <div class="tabpane" id="paneList">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="sQ" placeholder="Поиск по узлам и группам…"></div>
      <div id="nodeList"></div>
    </div>
  </aside>
  <section id="stage">
    <div id="canvas">
      <div id="world">
        <div id="framesLayer"></div>
        <svg id="edges" width="10" height="10">
          <defs>
            <marker id="arw" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M10 5 L1.34 0.67 Q0 0 0 1.5 L0 8.5 Q0 10 1.34 9.33 Z" fill="#5d636d"/></marker>
<marker id="arwHi" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M10 5 L1.34 0.67 Q0 0 0 1.5 L0 8.5 Q0 10 1.34 9.33 Z" fill="#9aa1ac"/></marker>

function ensureDialog(n){
  if(n.type!=='dialog')return;
  if(!n.dialog)n.dialog={participants:[],description:'',replies:[]};
  if(!Array.isArray(n.dialog.participants))n.dialog.participants=[];
  if(!Array.isArray(n.dialog.replies))n.dialog.replies=[];
  if(typeof n.dialog.description!=='string')n.dialog.description='';
}
function findReply(replies,id){
  for(var i=0;i<replies.length;i++){
    if(replies[i].id===id)return replies[i];
    if(replies[i].children){
      var f=findReply(replies[i].children,id);
      if(f)return f;
    }
  }
  return null;
}
function findReplyParent(replies,id,parent){
  for(var i=0;i<replies.length;i++){
    if(replies[i].id===id)return{arr:replies,idx:i,parent:parent};
    if(replies[i].children){
      var f=findReplyParent(replies[i].children,id,replies[i]);
      if(f)return f;
    }
  }
  return null;
}
function countReplies(replies){
  var c=0;
  replies.forEach(function(r){c++;if(r.children)c+=countReplies(r.children);});
  return c;
}
function dlgMaxDepth(replies,d){
  d=d||0;
  var max=d;
  replies.forEach(function(r){
    if(r.children&&r.children.length){
      var c=dlgMaxDepth(r.children,d+1);
      if(c>max)max=c;
    }
  });
  return max;
}
function dlgNodeWidth(n){
  ensureDialog(n);
  var maxD=dlgMaxDepth(n.dialog.replies);
  return (n.dlgWidth||NODE_W)+maxD*DLG_REPLY_INDENT;
}
function dlgMainAnchor(n,el){

function serialize(){return JSON.stringify({nodes:project.nodes,edges:project.edges,customTypes:project.customTypes,groups:project.groups});}
function pushHistory(s){history.push(s);if(history.length>150)history.shift();future.length=0;updateHistUI();}
function updateHistUI(){
  $('#bUndo').classList.toggle('disabled',history.length===0);
  $('#bRedo').classList.toggle('disabled',future.length===0);
}
function applySnap(s){
  var d=JSON.parse(s);
  project.nodes=d.nodes; project.edges=d.edges;
  project.customTypes=Array.isArray(d.customTypes)?d.customTypes:[];
  project.groups=Array.isArray(d.groups)?d.groups:[];
  var ids=new Set(project.nodes.map(function(n){return n.id;}));
  var ns=new Set(); sel.forEach(function(id){if(ids.has(id))ns.add(id);}); sel=ns;
  var eids=new Set(project.edges.map(function(e){return e.id;}));
  var es=new Set(); selEdges.forEach(function(id){if(eids.has(id))es.add(id);}); selEdges=es;
  if(selEdge&&!eids.has(selEdge))selEdge=null;
  var gids=new Set(project.groups.map(function(g){return g.id;}));
  var gs=new Set(); selGroups.forEach(function(id){if(gids.has(id))gs.add(id);}); selGroups=gs;
  if(selGroup&&!gids.has(selGroup))selGroup=null;
  renderAll(); markDirty();
}
function undo(){if(!history.length)return;future.push(serialize());applySnap(history.pop());updateHistUI();toast('Отменено','warn');}
function redo(){if(!future.length)return;history.push(serialize());applySnap(future.pop());updateHistUI();toast('Повторено','ok');}

var editLockIds=[];
/* объект, блокировка которого взята на время набора текста в инспекторе/модалке */
function editStartIds(){
  if(typeof syncState==='undefined'||!syncState||!syncState.enabled)return [];
  var ids=[];
  if(selEdge)ids=[selEdge];
  else if(selEdges&&selEdges.size===1&&!sel.size&&!selGroups.size)ids=[selEdges.values().next().value];
  else if(sel&&sel.size===1&&!selGroups.size)ids=[sel.values().next().value];
  else if(selGroups&&selGroups.size===1&&!sel.size)ids=[selGroups.values().next().value];
  return ids;
}
/* этот id сейчас удерживает активный жест/модалка (не «текстовая» блокировка)? */
function lockHeldByGesture(id){
  function inLK(lk){return !!lk&&(lk.indexOf?lk.indexOf(id)>=0:lk===id);}
  if(dragS&&inLK(dragS.lk))return true;
  if(gdrag&&inLK(gdrag.lk))return true;
  if(dlgResizeS&&inLK(dlgResizeS.lk))return true;
  if(grestore&&inLK(grestore.lk))return true;
  if(connS&&inLK(connS.lk))return true;
  if(brDrag&&brDrag.eid===id)return true;
  if(wpDrag&&wpDrag.eid===id)return true;
  if(lblDrag&&lblDrag.eid===id)return true;
  if(rpDrag&&rpDrag.eid===id)return true;
  if(inDrag&&inDrag.nid===id)return true;
  if(outDrag&&outDrag.nid===id)return true;
  if(repOutDrag&&repOutDrag.nid===id)return true;
  if(dlgModalNode&&dlgModalNode.id===id)return true;
  if(noteEditorState&&noteEditorState.n&&noteEditorState.n.id===id)return true;
  return false;
}
function editStart(){
  if(!preSnap)preSnap=serialize();
  /* soft-lock редактируемого объекта на время набора текста */
  var ids=editStartIds();
  for(var i=0;i<ids.length;i++){
    var id=ids[i];
    if(syncState.myLocks[id])continue; /* уже залочено жестом/модалкой — не трогаем */
    editLockIds.push(id);
    lockTake([id]);
  }
}
function editEnd(){
  if(preSnap && preSnap!==serialize()){pushHistory(preSnap);markDirty();}
  preSnap=null; renderList(); renderPalette();
  if(editLockIds.length){
    var rel=editLockIds.slice();editLockIds=[];
    setTimeout(function(){
      var rem=[];
      for(var i=0;i<rel.length;i++){
        if(editLockIds.indexOf(rel[i])>=0)continue;      /* снова печатаем */
        if(lockHeldByGesture(rel[i]))continue;            /* жест перехватил лок */
        rem.push(rel[i]);
      }
      if(rem.length)lockGive(rem);
    },220);
  }
}

function customById(id){

  for(var i=0;i<project.customTypes.length;i++)if(project.customTypes[i].id===id)return project.customTypes[i];

function groupById(id){

  for(var i=0;i<project.groups.length;i++)if(project.groups[i].id===id)return project.groups[i];
  return null;
}
function membersOf(gid){return project.nodes.filter(function(n){return n.gid===gid;});}
function groupOfNode(n){return (n&&n.gid)?groupById(n.gid):null;}
function typeInfo(key){
  if(TYPES[key])return TYPES[key];
  var c=customById(key);
  if(c)return c;

}
function nodeVisual(n){

function allTypeKeys(){return Object.keys(TYPES).concat(project.customTypes.map(function(c){return c.id;}));}

function gColor(g){return g.color||'#9aa1ac';}
function gAlpha(g){return clamp((typeof g.alpha==='number')?g.alpha:0.55,0.1,1);}
function groupDepth(g){
  var d=0,c=g,guard=0;
  while(c&&c.parent&&guard++<40){d++;c=groupById(c.parent);}
  return d;
}
function isDescendantGroup(childId,ancestorId){
  var g=groupById(childId),guard=0;
  while(g&&g.parent&&guard++<40){
    if(g.parent===ancestorId)return true;
    g=groupById(g.parent);
  }
  return false;
}
function descGroupIds(gid){
  var out=[];
  (function walk(id){
    project.groups.forEach(function(cg){
      if(cg.parent===id){out.push(cg.id);walk(cg.id);}
    });
  })(gid);
  return out;
}
function chainOfG(gid){
  var out=[],g=groupById(gid),guard=0;
  while(g&&guard++<40){out.push(g.id);g=g.parent?groupById(g.parent):null;}
  return out;
}
function allDescNodes(gid,visited){
  visited=visited||new Set();
  if(visited.has(gid))return [];
  visited.add(gid);
  var out=[];
  project.nodes.forEach(function(n){if(n.gid===gid)out.push(n);});
  project.groups.forEach(function(cg){
    if(cg.parent===gid)out=out.concat(allDescNodes(cg.id,visited));
  });
  return out;
}
function belongsToGroup(n,gid){
  if(!n||!n.gid)return false;
  var g=groupById(n.gid),guard=0;
  while(g&&guard++<40){
    if(g.id===gid)return true;
    g=g.parent?groupById(g.parent):null;
  }
  return false;
}
function collapsedAncestorOf(n){
  var g=groupOfNode(n),guard=0;
  while(g&&guard++<40){
    if(g.fold<2)return g;
    g=g.parent?groupById(g.parent):null;
  }
  return null;
}
function groupInsideCollapsed(g){
  var p=g.parent?groupById(g.parent):null,guard=0;
  while(p&&guard++<40){
    if(p.fold<2)return true;
    p=p.parent?groupById(p.parent):null;
  }
  return false;
}
function revealNode(n){
  var g=groupOfNode(n),guard=0;
  var chain=[];
  while(g&&guard++<40){
    if(g.fold<2)chain.push(g);
    g=g.parent?groupById(g.parent):null;
  }
  if(chain.length){
    discrete(function(){chain.forEach(function(cg){cg.fold=2;});});
    renderAll();
  }
}
function groupRectWorld(g){
  var el=groupEls.get(g.id);
  if(g.fold===2){
    if(!g.auto&&g.fx!=null&&g.fw!=null&&g.fh!=null)return{x:g.fx,y:g.fy,w:g.fw,h:g.fh};
    if(!el||el.style.display==='none')return null;
    return{x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};
  }
  if(!el||el.style.display==='none')return null;
  return{x:g.x||0,y:g.y||0,w:GCARD_W,h:el.offsetHeight||44};
}
function rectCenterOf(g){
  var r=groupRectWorld(g);
  return r?{x:r.x+r.w/2,y:r.y+r.h/2}:null;
}
function deepestGroupAt(wx,wy){
  var best=null,bestDepth=-1;
  project.groups.forEach(function(g){
    if(groupInsideCollapsed(g))return;
    var r=groupRectWorld(g);
    if(!r)return;
    if(wx>=r.x&&wx<=r.x+r.w&&wy>=r.y&&wy<=r.y+r.h){
      var d=groupDepth(g);
      if(d>bestDepth){bestDepth=d;best=g;}
    }
  });
  return best;
}
function groupDropTargetAt(wx,wy,excludeIds){
  var best=null,bestDepth=-1;
  project.groups.forEach(function(g){
    if(g.fold!==2)return;
    if(excludeIds&&excludeIds.has(g.id))return;
    if(groupInsideCollapsed(g))return;
    var r=groupRectWorld(g);
    if(!r)return;
    if(wx>=r.x&&wx<=r.x+r.w&&wy>=r.y&&wy<=r.y+r.h){
      var d=groupDepth(g);
      if(d>bestDepth){bestDepth=d;best=g;}
    }
  });
  return best;
}
function captureNodesInto(g){
  var r=groupRectWorld(g);
  if(!r)return 0;
  var cnt=0;
  project.nodes.forEach(function(n){
    if(collapsedAncestorOf(n))return;
    if(belongsToGroup(n,g.id))return;
    var el=nodeEls.get(n.id);
    var h=(el&&el.style.display!=='none')?el.offsetHeight:90;
    var w=(el&&el.style.display!=='none')?el.offsetWidth:NODE_W;
    var cx=n.x+w/2, cy=n.y+h/2;
    if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h){n.gid=g.id;cnt++;}
  });
  return cnt;
}
function captureGroupsInto(g){
  var r=groupRectWorld(g);
  if(!r)return 0;
  var ancSet=new Set(chainOfG(g.id));
  var covered=[];
  project.groups.forEach(function(o){
    if(o.id===g.id||ancSet.has(o.id))return;
    if(o.fold<2)return;
    var or=groupRectWorld(o);
    if(!or)return;
    var tol=4;
    if(or.x>=r.x-tol&&or.y>=r.y-tol&&or.x+or.w<=r.x+r.w+tol&&or.y+or.h<=r.y+r.h+tol)covered.push(o);
  });
  var cnt=0;
  covered.forEach(function(o){
    var hasCAnc=false;
    var a=o.parent?groupById(o.parent):null,guard=0;
    while(a&&guard++<40){
      if(covered.indexOf(a)>=0){hasCAnc=true;break;}
      a=a.parent?groupById(a.parent):null;
    }
    if(hasCAnc)return;
    if((o.parent||null)!==g.id){o.parent=g.id;cnt++;}
  });
  return cnt;
}
function reparentAfterMove(g){
  var changed=false;
  var c=rectCenterOf(g);
  if(captureGroupsInto(g)>0)changed=true;
  if(captureNodesInto(g)>0)changed=true;
  var excl=new Set([g.id].concat(descGroupIds(g.id)));
  var target=c?groupDropTargetAt(c.x,c.y,excl):null;
  var newPar=target?target.id:null;
  if((g.parent||null)!==newPar){g.parent=newPar;changed=true;}
  return changed;
}

function layoutDlgConnectors(el){

  for(var i=0;i<chs.length;i++){
    var items=chs[i].children;
    if(!items.length)continue;
    var last=items[items.length-1];
    if(!last.classList||!last.classList.contains('dlg-item'))continue;
    var row=last.querySelector('.dlg-reply-row');
    if(!row)continue;
    var rowH=row.offsetHeight;

    last.style.setProperty('--lk',(2+rowH/2+topOff)+'px');
  }

function updateDlgRowStates(){

      if(e.from===n.id&&e.fromReply){outs[e.fromReply]=true;any=true;}
    });

function groupBounds(gid,visited){
  visited=visited||new Set();
  if(visited.has(gid))return null;
  visited.add(gid);
  var g=groupById(gid);if(!g)return null;
  if(g.fold<2){
    var cel=groupEls.get(gid),ch=cel?cel.offsetHeight:44;
    return{minX:g.x||0,minY:g.y||0,maxX:(g.x||0)+GCARD_W,maxY:(g.y||0)+ch};
  }
  if(!g.auto&&g.fx!=null&&g.fw!=null&&g.fh!=null){
    return{minX:g.fx,minY:g.fy,maxX:g.fx+g.fw,maxY:g.fy+g.fh};
  }
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,found=false;
  membersOf(gid).forEach(function(n){
    var nel=nodeEls.get(n.id),h=(nel&&nel.style.display!=='none')?nel.offsetHeight:90;
    var w=(nel&&nel.style.display!=='none')?nel.offsetWidth:NODE_W;
    found=true;
    minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+w);maxY=Math.max(maxY,n.y+h);
  });
  project.edges.forEach(function(e){
    if(!e.pts||!e.pts.length)return;
    var nf=nodeById(e.from),nt=nodeById(e.to);
    if(belongsToGroup(nf,gid)&&belongsToGroup(nt,gid)){
      e.pts.forEach(function(p){
        minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);
        maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);
      });
    }
  });
  project.groups.forEach(function(cg){
    if(cg.parent!==gid)return;
    var b=groupBounds(cg.id,visited);
    if(!b)return;
    found=true;
    minX=Math.min(minX,b.minX-10);minY=Math.min(minY,b.minY-8);
    maxX=Math.max(maxX,b.maxX+10);maxY=Math.max(maxY,b.maxY+10);
  });
  if(!found)return null;
  return{minX:minX,minY:minY,maxX:maxX,maxY:maxY};
}
function frameRectOf(g){
  if(!g.auto&&g.fx!=null&&g.fw!=null&&g.fh!=null)return{x:g.fx,y:g.fy,w:g.fw,h:g.fh};
  var b=groupBounds(g.id);
  if(!b)return null;
  var pad=14,head=26;
  return{x:b.minX-pad,y:b.minY-pad-head,w:b.maxX-b.minX+pad*2,h:b.maxY-b.minY+pad*2+head};
}
function refreshGroupFrames(){
  var byDepth=project.groups.slice().sort(function(a,b){return groupDepth(b)-groupDepth(a);});
  byDepth.forEach(function(g){
    if(g.fold<2)return;
    if(!g.auto&&g.fx!=null&&g.fw!=null&&g.fh!=null){
      project.groups.forEach(function(cg){
        if(cg.parent!==g.id)return;
        if(activeGroupDragIds&&activeGroupDragIds.has(cg.id))return;
        var cr=frameRectOf(cg);
        if(!cr)return;
        var mSide=10,mTop=30,mBot=10;
        if(cr.x-mSide<g.fx)g.fx=cr.x-mSide;
        if(cr.y-mTop<g.fy)g.fy=cr.y-mTop;
        if(cr.x+cr.w+mSide>g.fx+g.fw)g.fw=cr.x+cr.w+mSide-g.fx;
        if(cr.y+cr.h+mBot>g.fy+g.fh)g.fh=cr.y+cr.h+mBot-g.fy;
      });
    }
  });
  project.groups.forEach(function(g){
    if(g.fold<2)return;
    var el=groupEls.get(g.id);if(!el)return;
    if(groupInsideCollapsed(g)){el.style.display='none';return;}
    var fr=frameRectOf(g);
    if(!fr){el.style.display='none';return;}
    el.style.display='';
    el.style.left=fr.x+'px';
    el.style.top=fr.y+'px';
    el.style.width=fr.w+'px';el.style.height=fr.h+'px';});updateGroupBadges();miniMapSync();}

function nodeById(id){for(var i=0;i<project.nodes.length;i++)if(project.nodes[i].id===id)return project.nodes[i];return null;}
function edgeById(id){for(var i=0;i<project.edges.length;i++)if(project.edges[i].id===id)return project.edges[i];return null;}
function memberFrac(g,n){
  var hh=(g.hh&&g.hh[n.id])||90;
  if(!g.bbox)return null;
  var span=g.bbox[1]-g.bbox[0];
  if(span<1)return null;
  return clamp((n.y+hh/2-g.bbox[0])/span,0.07,0.93);
}
function spreadFrac(gid,edgeId,dir){
  var list=project.edges.filter(function(e){
    var nn=dir==='out'?nodeById(e.from):nodeById(e.to);
    return belongsToGroup(nn,gid);
  });
  list.sort(function(a,b){return a.id<b.id?-1:1;});
  var i=0;
  for(var k=0;k<list.length;k++){if(list[k].id===edgeId){i=k;break;}}
  return (i+1)/(list.length+1);
}
function cardRowPoint(g,n,side){

function edgeAnchors(e){
  var na=nodeById(e.from),nb=nodeById(e.to);
  if(!na||!nb)return null;
  if(isBridge(e)){
        var elA0=nodeEls.get(na.id),elB0=nodeEls.get(nb.id);
    var wA0=elA0?elA0.offsetWidth:NODE_W,hA0=elA0?elA0.offsetHeight:90;

  }
  var ga=collapsedAncestorOf(na),gb=collapsedAncestorOf(nb);
  var ca=!!ga,cb=!!gb;

    var nodeElA=nodeEls.get(na.id);

      var exA=(na.expand===0||na.expand===1||na.expand===2)?na.expand:1;
      rp=(exA===0)?dlgCollapsePortPos(nodeElA):dlgReplyPortPos(nodeElA,e.fromReply);
    }

  }else if(ca){

    else{
      var elA=groupEls.get(ga.id),hA=elA?elA.offsetHeight:44;
      var fa=memberFrac(ga,na);

      x1=ga.x+GCARD_W;y1=ga.y+hA*fa;
    }
  }else{
    var a=nodeEls.get(na.id);if(!a)return null;
    if(na.type==='dialog'){

      x1=mm.x;y1=mm.y;

      x1=na.x+a.offsetWidth;y1=na.y+a.offsetHeight/2;

  if(cb){
    var rp2=cardRowPoint(gb,nb,'in');
    if(rp2){x2=rp2.x;y2=rp2.y;}
    else{
      var elB=groupEls.get(gb.id),hB=elB?elB.offsetHeight:44;

    }
  }else{
    var b=nodeEls.get(nb.id);if(!b)return null;
    x2=nb.x;y2=nb.y+b.offsetHeight/2;
  }
  return{x1:x1,y1:y1,x2:x2,y2:y2};
}
function edgeGeom(e){

function bridgeGeom(e){
  var na=nodeById(e.from),nb=nodeById(e.to);
  var elA=nodeEls.get(na.id),elB=nodeEls.get(nb.id);
  var wA=elA?elA.offsetWidth:NODE_W,hA=elA?elA.offsetHeight:90,hB=elB?elB.offsetHeight:90;
  var bd=e.bd||{dl:0,dy:0,dr:0};
  var x1=na.x+wA,y1=na.y+hA/2;
  var x2=nb.x,y2=nb.y+hB/2;
  var gy0=(na.y+hA+nb.y)/2;
  return{x1:x1,y1:y1,x2:x2,y2:y2,bx1:x2-56+bd.dl,bx2:x1+30+bd.dr,gy:gy0+bd.dy};
}
function bridgeCorners(e){
  var bg=bridgeGeom(e);
  return[{x:bg.bx2,y:bg.y1},{x:bg.bx2,y:bg.gy},{x:bg.bx1,y:bg.gy},{x:bg.bx1,y:bg.y2}];
}
function orthoPath(a){
  var P=[{x:a.x1,y:a.y1}];
  a.corners.forEach(function(q){P.push(q);});
  P.push({x:a.x2,y:a.y2});
  var r=12;
  var d='M'+P[0].x+' '+P[0].y;
  for(var i=1;i<P.length-1;i++){
    var p0=P[i-1],p1=P[i],p2=P[i+1];

function dlgModalRender(){
