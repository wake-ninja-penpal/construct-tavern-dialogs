function dlgModalRenderReplies(replies,depth,chars){
  if(depth>=MAX_DLG_DEPTH)return '';
  var html='';
  replies.forEach(function(r){
    var isRoot=depth===0;
    var speakerOpts='<option value="">— не выбран —</option>';
    chars.forEach(function(c){
      speakerOpts+='<option value="'+esc(c.id)+'"'+(c.id===r.speaker?' selected':'')+'>'+esc(c.title)+'</option>';
    });
    html+='<div class="dlg-reply-ed'+(isRoot?' root':'')+'" data-rid="'+esc(r.id)+'">'+
      '<div class="dlg-reply-row-ed">'+
        '<select data-f="speaker">'+speakerOpts+'</select>'+
        '<textarea data-f="text" placeholder="Текст реплики…">'+esc(r.text||'')+'</textarea>'+
      '</div>'+
      '<div class="dlg-reply-acts">'+
        '<button class="mini-btn dlg-drag" data-act="drag" title="Перетащить — изменить порядок">'+ic('grip',11)+'</button>'+
        '<button class="mini-btn" data-act="add-below" title="Новая реплика ниже">'+ic('plus',11)+'</button>'+
        '<button class="mini-btn" data-act="add-child" title="Ответ-ветка (вложенная)">'+ic('corner',11)+'</button>'+
        '<button class="mini-btn del" data-act="del" title="Удалить реплику">'+ic('x',11)+'</button>'+
      '</div>';
    if(r.children&&r.children.length){
      html+='<div class="dlg-children-ed">'+dlgModalRenderReplies(r.children,depth+1,chars)+'</div>';
    }
    html+='</div>';
  });
  return html;
}
function dlgModalBind(chars){
  var n=dlgModalNode;if(!n)return;
  var d=n.dialog;
  var addRoot=$('#dlgAddRootModal');
  if(addRoot){
    addRoot.onclick=function(){
      discrete(function(){
        d.replies.push({id:uid(),speaker:chars[0]?chars[0].id:null,text:'',children:[]});
      });
      dlgModalRender();
      renderAll();
    };
  }
  $all('#dlgModalBody .dlg-reply-ed').forEach(function(ed){
    var rid=ed.getAttribute('data-rid');
    var r=findReply(d.replies,rid);
    if(!r)return;
    var spSel=ed.querySelector('select[data-f="speaker"]');
    var txt=ed.querySelector('textarea[data-f="text"]');
    if(spSel){
      spSel.addEventListener('focus',editStart);
      spSel.addEventListener('change',function(){
        r.speaker=spSel.value||null;
        editEnd();
        dlgModalRender();
        renderAll();
      });
    }
    if(txt){
      txt.addEventListener('focus',editStart);
      txt.addEventListener('input',function(){
        r.text=txt.value;
        markDirty();
        var nodeEl=nodeEls.get(n.id);
        if(nodeEl){
          var tree=nodeEl.querySelector('.dlg-tree');
          if(tree)tree.innerHTML=dlgTreeInner(n,n.expand);
          updateDlgRowStates();
        }
      });
      txt.addEventListener('change',editEnd);
      txt.addEventListener('blur',editEnd);
    }
    var acts=ed.querySelectorAll('.dlg-reply-acts .mini-btn');
    for(var i=0;i<acts.length;i++){
      (function(b){
        b.onclick=function(){
          var act=b.getAttribute('data-act');
          if(act==='del'){
            discrete(function(){
              var loc=findReplyParent(d.replies,rid,null);
              if(loc)loc.arr.splice(loc.idx,1);
              project.edges=project.edges.filter(function(e){return !(e.from===n.id&&e.fromReply===rid);});
            });
            dlgModalRender();
            renderAll();
          }else if(act==='add-below'){
            /* новая реплика сразу под этой (соседняя, тот же уровень) */
            discrete(function(){
              var loc=findReplyParent(d.replies,rid,null);
              if(loc)loc.arr.splice(loc.idx+1,0,{id:uid(),speaker:(r.speaker!=null?r.speaker:(chars[0]?chars[0].id:null)),text:'',children:[]});
            });
            dlgModalRender();
            renderAll();
          }else if(act==='add-child'){
            discrete(function(){
              if(!r.children)r.children=[];
              r.children.push({id:uid(),speaker:chars[0]?chars[0].id:null,text:'',children:[]});
            });
            dlgModalRender();
            renderAll();
          }
        };
      })(acts[i]);
    }
    /* ── перетаскивание реплик (порядок среди соседних) ── */
    var handle=ed.querySelector('.dlg-drag');
    if(handle){
      handle.addEventListener('mousedown',function(){ed.setAttribute('draggable','true');});
      handle.addEventListener('dblclick',function(ev){ev.preventDefault();});
    }
    ed.addEventListener('dragstart',function(ev){
      if(ed.getAttribute('draggable')!=='true'){ev.preventDefault();return;}
      ev.dataTransfer.effectAllowed='move';
      try{ev.dataTransfer.setData('text/plain',rid);}catch(e){}
      dlgDragRid=rid;
      setTimeout(function(){ed.classList.add('dragging');},0);
    });
    ed.addEventListener('dragend',function(){
      ed.removeAttribute('draggable');
      ed.classList.remove('dragging');
      $all('#dlgModalBody .dlg-reply-ed').forEach(function(x){x.classList.remove('drop-above','drop-below');});
      dlgDragRid=null;
    });
    ed.addEventListener('dragover',function(ev){
      if(!dlgDragRid||dlgDragRid===rid)return;
      var inner=ev.target&&ev.target.closest?ev.target.closest('.dlg-reply-ed'):null;
      if(inner&&inner!==ed)return; /* вложенная реплика обработает сама */
      var srcLoc=findReplyParent(d.replies,dlgDragRid,null);
      var tgtLoc=findReplyParent(d.replies,rid,null);
      if(!srcLoc||!tgtLoc||srcLoc.parent!==tgtLoc.parent)return; /* только соседние */
      ev.preventDefault();
      ev.dataTransfer.dropEffect='move';
      var rect=ed.getBoundingClientRect();
      var below=(ev.clientY-rect.top)>(rect.height/2);
      ed.classList.toggle('drop-below',below);
      ed.classList.toggle('drop-above',!below);
    });
    ed.addEventListener('dragleave',function(){
      ed.classList.remove('drop-above','drop-below');
    });
    ed.addEventListener('drop',function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      var srcRid=dlgDragRid;
      var rect=ed.getBoundingClientRect();
      var below=(ev.clientY-rect.top)>(rect.height/2);
      ed.classList.remove('drop-above','drop-below');
      if(!srcRid||srcRid===rid)return;
      var srcLoc=findReplyParent(d.replies,srcRid,null);
      var tgtLoc=findReplyParent(d.replies,rid,null);
      if(!srcLoc||!tgtLoc||srcLoc.parent!==tgtLoc.parent){toast('Перемещать можно только реплики одного уровня','warn');return;}
      discrete(function(){
        var s=findReplyParent(d.replies,srcRid,null);
        var t=findReplyParent(d.replies,rid,null);
        if(!s||!t||s.parent!==t.parent)return;
        var moved=s.arr.splice(s.idx,1)[0];
        var insAt=(s.idx<t.idx)?(t.idx-1):t.idx;
        if(below)insAt+=1;
        t.arr.splice(insAt,0,moved);
      });
      dlgDragRid=null;
      dlgModalRender();
      renderAll();
    });
  });
}

var NOTE_MAX=3;

function noteIconSvg(size){return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 15.5h7M9 8.5h3"/></svg>';}
function sanitizeNoteHtml(html){
var tpl=document.createElement('template');
tpl.innerHTML=String(html||'');
var bad=tpl.content.querySelectorAll('script,style,iframe,object,embed,link,meta');
for(var i=0;i<bad.length;i++)bad[i].remove();
var all=tpl.content.querySelectorAll('*');
for(var j=0;j<all.length;j++){
var el=all[j];
var attrs=Array.prototype.slice.call(el.attributes);
for(var k=0;k<attrs.length;k++){
var an=attrs[k].name.toLowerCase();
if(an.indexOf('on')===0)el.removeAttribute(attrs[k].name);
if((an==='href'||an==='src')&&/^\s*javascript:/i.test(attrs[k].value))el.removeAttribute(attrs[k].name);
}
}
return tpl.innerHTML;
}
function ensureNotes(n){if(!Array.isArray(n.notes))n.notes=[];}
function visibleNotes(n){ensureNotes(n);return n.notes.filter(function(x){return !x.hidden;});}
function renderNodeNotes(n,el){
var old=el.querySelector('.node-notes');if(old)old.remove();
ensureNotes(n);

if(!vis.length)return;
var box=document.createElement('div');
box.className='node-notes';
vis.forEach(function(note){
var b=document.createElement('button');
b.className='node-note-ico';
b.title=note.title||'Заметка';
b.innerHTML=noteIconSvg(18);
b.addEventListener('click',function(ev){ev.stopPropagation();openNoteView(n,note);});
box.appendChild(b);
});
el.appendChild(box);
}
function notesSectionHtml(n){

var rows='';
n.notes.forEach(function(note,ni){
rows+='<div class="note-row'+(note.hidden?' hidden':'')+'" data-ni="'+ni+'">'+
'<span class="note-row-title" data-note-view="'+ni+'">'+esc(note.title||'Без названия')+'</span>'+
'<span class="note-row-acts">'+
'<button class="mini-btn" data-note-act="edit" data-ni="'+ni+'" title="Редактировать">'+ic('pencil',12)+'</button>'+
'<button class="mini-btn eye'+(note.hidden?' off':'')+'" data-note-act="hide" data-ni="'+ni+'" title="'+(note.hidden?'Показать':'Скрыть от элемента')+'">'+ic(note.hidden?'eyeOff':'eye',12)+'</button>'+
'<button class="mini-btn del" data-note-act="del" data-ni="'+ni+'" title="Удалить">'+ic('x',12)+'</button>'+
'</span></div>';

return '<label class="i-lab" style="display:flex;align-items:center;justify-content:space-between">Заметки ('+cnt+'/'+NOTE_MAX+')'+
'<span style="display:flex;gap:4px">'+
'<button class="mini-btn eye'+(anyVisible?'':' off')+'" id="notesHideAll" title="'+(anyVisible?'Скрыть все у элемента':'Показать все')+'">'+ic(anyVisible?'eye':'eyeOff',12)+'</button>'+

function openNoteEditor(n,idx){
var lkN=lockBlockedBy([n.id]);
if(lkN){showLockTip(lastPtr.x,lastPtr.y,lkN);return;}
ensureNotes(n);
var isNew=idx<0;
if(isNew&&n.notes.length>=NOTE_MAX){toast('Максимум '+NOTE_MAX+' заметки','warn');return;}
lockTake([n.id]);
var note=isNew?{title:'',html:'',hidden:false}:n.notes[idx];
noteEditorState={n:n,idx:idx,isNew:isNew};
$('#noteTitle').value=note.title||'';
$('#noteBody').innerHTML=sanitizeNoteHtml(note.html||'');
$('#noteModalTitle').textContent=isNew?'Новая заметка':'Редактирование заметки';
$('#noteModal').classList.add('show');
setTimeout(function(){$('#noteBody').focus();},40);
}
function closeNoteEditor(){
  if(noteEditorState&&noteEditorState.n)lockGive([noteEditorState.n.id]);
  $('#noteModal').classList.remove('show');noteEditorState=null;
}
function saveNoteEditor(){
if(!noteEditorState)return;
var n=noteEditorState.n,idx=noteEditorState.idx;
var title=($('#noteTitle').value||'').trim()||'Заметка';
var html=sanitizeNoteHtml($('#noteBody').innerHTML);
ensureNotes(n);
pushHistory(serialize());
if(idx<0){n.notes.push({title:title,html:html,hidden:false});}
else{n.notes[idx].title=title;n.notes[idx].html=html;}
markDirty();
closeNoteEditor();
renderAll();
toast('Заметка сохранена');
}
function openNoteView(n,note){
noteViewState={n:n,note:note};
$('#noteViewTitle').textContent=note.title||'Заметка';
var c=$('#noteViewBody');
c.innerHTML=sanitizeNoteHtml(note.html||'<div class="note-empty">Пусто</div>');
var boxes=c.querySelectorAll('.nc-box');
for(var i=0;i<boxes.length;i++){
(function(bx){
var row=bx.closest('.nc-row');
if(row&&row.getAttribute('data-checked')==='1')row.classList.add('struck');
bx.addEventListener('click',function(ev){
ev.stopPropagation();
if(!noteViewState)return;
var r=bx.closest('.nc-row');if(!r)return;
var on=r.getAttribute('data-checked')==='1';
r.setAttribute('data-checked',on?'0':'1');
r.classList.toggle('struck',!on);
noteViewState.note.html=sanitizeNoteHtml($('#noteViewBody').innerHTML);
markDirty();
});
})(boxes[i]);
}
$('#noteViewModal').classList.add('show');
}
function closeNoteView(){$('#noteViewModal').classList.remove('show');noteViewState=null;}
function bindNotesDelegation(){
insp.addEventListener('click',function(e){
var n=currentInspNode();if(!n)return;
var add=e.target.closest?e.target.closest('#notesAdd'):null;
if(add){ensureNotes(n);if(n.notes.length>=NOTE_MAX){toast('Максимум '+NOTE_MAX+' заметки','warn');return;}openNoteEditor(n,-1);return;}
var ha=e.target.closest?e.target.closest('#notesHideAll'):null;
if(ha){ensureNotes(n);var anyVis=n.notes.some(function(x){return !x.hidden;});discrete(function(){n.notes.forEach(function(x){x.hidden=anyVis;});});renderAll();return;}
var act=e.target.closest?e.target.closest('[data-note-act]'):null;
if(act){
var ni=+act.getAttribute('data-ni');var a=act.getAttribute('data-note-act');
ensureNotes(n);var note=n.notes[ni];if(!note)return;
if(a==='edit'){openNoteEditor(n,ni);}
else if(a==='del'){discrete(function(){n.notes.splice(ni,1);});renderAll();toast('Заметка удалена','warn');}
else if(a==='hide'){discrete(function(){note.hidden=!note.hidden;});renderAll();}
return;
}
var vt=e.target.closest?e.target.closest('[data-note-view]'):null;
if(vt){var ni2=+vt.getAttribute('data-note-view');ensureNotes(n);if(n.notes[ni2])openNoteView(n,n.notes[ni2]);return;}
});

function syncSel(){
  nodeEls.forEach(function(el,id){el.classList.toggle('sel',sel.has(id));});
  edgeEls.forEach(function(r,id){r.g.classList.toggle('sel',selEdges.has(id));});
  groupEls.forEach(function(el,gid){el.classList.toggle('sel',selGroups.has(gid));});
  project.edges.forEach(function(e){setRowSrcSel(e);});
  $all('#palList .cv-card').forEach(function(el){el.classList.toggle('sel',sel.has(el.dataset.node));});
  $all('#nodeList .nli[data-id]').forEach(function(el){el.classList.toggle('sel',sel.has(el.dataset.id));});
  $all('#nodeList .nli[data-gid]').forEach(function(el){el.classList.toggle('sel',selGroups.has(el.dataset.gid));});
}
function selectOnly(id){sel=new Set([id]);selGroups.clear();selGroup=null;selEdges.clear();selEdge=null;syncSel();renderInspector();}
function selectEdgeOnly(id){selEdge=id;selEdges=new Set([id]);sel.clear();selGroups.clear();selGroup=null;syncSel();renderInspector();}
function selectGroup(gid){selGroup=gid;selGroups=new Set([gid]);sel.clear();selEdges.clear();selEdge=null;syncSel();renderInspector();}
function clearSel(){sel.clear();selGroups.clear();selGroup=null;selEdges.clear();selEdge=null;syncSel();renderInspector();}
/* ═══ операции с узлами ═══ */
function addNode(typeKey,x,y,select){
  var info=typeInfo(typeKey);
  var n={id:uid(),type:typeKey,gid:null,x:Math.round(x),y:Math.round(y),title:info.name,text:'',status:'idea',tags:[],expand:1,color:null,tint:0,dlgWidth:null};
  if(typeKey==='dialog'){ensureDialog(n);}
  mutate(function(){project.nodes.push(n);},{nodes:[n.id]});
  if(select)selectOnly(n.id);
  return n;
}
function cloneNode(src,x,y){
  var c={id:uid(),type:src.type,gid:null,x:Math.round(x),y:Math.round(y),title:src.title,text:src.text,
    status:src.status,tags:(src.tags||[]).slice(),expand:(src.expand===0||src.expand===1||src.expand===2)?src.expand:1,
    color:src.color||null,tint:src.tint||0,dlgWidth:src.dlgWidth||null,notes:src.notes?JSON.parse(JSON.stringify(src.notes)):[]};
  if(src.type==='dialog'&&src.dialog){
    c.dialog=JSON.parse(JSON.stringify(src.dialog));
  }
  return c;
}
function removeSelected(){
  var lkIds=[];
  if(selEdge)lkIds.push(selEdge);
  if(selEdges.size)selEdges.forEach(function(i){lkIds.push(i);});
  if(sel.size)sel.forEach(function(i){lkIds.push(i);});
  if(selGroups.size)selGroups.forEach(function(i){lkIds.push(i);});
  var lkBlk=lockBlockedBy(lkIds);
  if(lkBlk){showLockTip(lastPtr.x,lastPtr.y,lkBlk);return;}
  if(selEdge||selEdges.size){
    var ids=new Set(selEdges.size?Array.from(selEdges):(selEdge?[selEdge]:[]));
    mutate(function(){
      project.edges=project.edges.filter(function(e){return !ids.has(e.id);});
      selEdges.clear();selEdge=null;
    });
    return;
  }
  if(!sel.size&&!selGroups.size)return;
  mutate(function(){
    if(selGroups.size){
      var gids=new Set(selGroups);
      var arr=Array.from(selGroups).sort(function(a,b){return groupDepth(groupById(b))-groupDepth(groupById(a));});
      arr.forEach(function(gid){
        var g=groupById(gid);if(!g)return;
        project.nodes.forEach(function(n){if(n.gid===gid)n.gid=g.parent||null;});
        project.groups.forEach(function(cg){if(cg.parent===gid)cg.parent=g.parent||null;});
      });
      project.groups=project.groups.filter(function(g){return !gids.has(g.id);});
    }
    if(sel.size){
      project.nodes=project.nodes.filter(function(n){return !sel.has(n.id);});
      project.edges=project.edges.filter(function(e){return !sel.has(e.from)&&!sel.has(e.to);});
    }
    var changed=true;
    while(changed){
      changed=false;
      project.groups=project.groups.filter(function(g){
        if(allDescNodes(g.id).length===0){changed=true;return false;}
        return true;
      });
    }
    sel.clear();selGroups.clear();selGroup=null;
  });
}
function duplicateSel(){
  if(!sel.size){toast('Нет узлов для дублирования','warn');return null;}
  var pre=serialize();
  var map=new Map(),spawn=[];
  var old=[]; sel.forEach(function(id){old.push(id);});
  old.forEach(function(id){
    var o=nodeById(id); if(!o)return;
    var c=cloneNode(o,o.x+32,o.y+32);
    map.set(id,c.id); project.nodes.push(c); spawn.push(c.id);
  });
  var add=[];
  project.edges.forEach(function(e){
    if(map.has(e.from)&&map.has(e.to))add.push({id:uid(),from:map.get(e.from),to:map.get(e.to),label:e.label,kind:e.kind,pts:(e.pts||[]).map(function(p){return{x:p.x,y:p.y};}),lt:e.lt,lp:e.lp,fromReply:e.fromReply||null,bd:e.bd?{dl:e.bd.dl,dy:e.bd.dy,dr:e.bd.dr}:{dl:0,dy:0,dr:0}});
  });
  add.forEach(function(e){project.edges.push(e);});
  sel=new Set(spawn);
  renderAll({nodes:spawn});
  markDirty();
  return{ids:spawn,pre:pre};
}
function startCarry(ids,pre){
  if(!ids||!ids.length)return;
  var orig=new Map(),cx=0,cy=0;
  ids.forEach(function(id){
    var n=nodeById(id);if(!n)return;
    orig.set(id,{x:n.x,y:n.y});
    cx+=n.x+NODE_W/2;cy+=n.y+45;
  });
  cx/=ids.length;cy/=ids.length;
  carryS={ids:ids,pre:pre,orig:orig,cx:cx,cy:cy};
  document.body.classList.add('carry');
  toast('Дубликат следует за курсором: клик — поставить, Esc/ПКМ — отменить');
}
function placeCarry(){
  if(!carryS)return;
  pushHistory(carryS.pre);
  carryS.ids.forEach(function(id){
    var n=nodeById(id);if(!n)return;
    var el=nodeEls.get(id);
    var h=(el&&el.style.display!=='none')?el.offsetHeight:90;
    var w=(el&&el.style.display!=='none')?el.offsetWidth:NODE_W;
    var tg=deepestGroupAt(n.x+w/2,n.y+h/2);
    n.gid=tg?tg.id:null;
  });
  endCarry();
  renderAll();markDirty();
  toast('Дубликат размещён');
}
function cancelCarry(){
  if(!carryS)return;
  var pre=carryS.pre;
  endCarry();
  applySnap(pre);
  toast('Дублирование отменено','warn');
}
function endCarry(){document.body.classList.remove('carry');carryS=null;}
function detachNode(id){
  var ins=project.edges.filter(function(e){return e.to===id;});
  var outs=project.edges.filter(function(e){return e.from===id;});
  if(!ins.length&&!outs.length)return;
  project.edges=project.edges.filter(function(e){return e.from!==id&&e.to!==id;});
  ins.forEach(function(ei){
    outs.forEach(function(eo){
      if(ei.from===eo.to)return;
      var dup=project.edges.some(function(x){return x.from===ei.from&&x.to===eo.to;});
      if(!dup)project.edges.push({id:uid(),from:ei.from,to:eo.to,label:eo.label||'',kind:eo.kind||'flow',pts:[],lt:0.5,lp:0,fromReply:null});
    });
  });
  renderAll();
  toast('Узел выдернут, цепочка сохранена');
}
function alignSelH(){
  var ids=[];
  sel.forEach(function(id){
    var n=nodeById(id);
    if(n&&!collapsedAncestorOf(n))ids.push(id);
  });
  if(ids.length<2){toast('Выделите минимум два узла','warn');return;}
  pushHistory(serialize());
  var sum=0;
  ids.forEach(function(id){
    var n=nodeById(id);
    var el=nodeEls.get(id);
    var h=(el&&el.style.display!=='none')?el.offsetHeight:90;
    sum+=n.y+h/2;
  });
  var avg=sum/ids.length;
  ids.forEach(function(id){
    var n=nodeById(id);
    var el=nodeEls.get(id);
    var h=(el&&el.style.display!=='none')?el.offsetHeight:90;
    n.y=Math.round(avg-h/2);
    if(el)el.style.top=n.y+'px';
  });
  ids.forEach(function(id){updateEdgesFor(id);});
  refreshGroupFrames();
  markDirty();
  toast('Выровнено по горизонтали');
}
/* ═══ распределение выделения в строки с мостами ═══ */
function layoutRows(ids,k){
  var rows=[];
  for(var i=0;i<ids.length;i+=k)rows.push(ids.slice(i,i+k));
  var maxW=0,maxH=0;
  ids.forEach(function(id){
    var n=nodeById(id);
    var el=nodeEls.get(id);
    maxW=Math.max(maxW,el?el.offsetWidth:dlgNodeWidth(n));
    maxH=Math.max(maxH,el?el.offsetHeight:90);
  });
  var colStep=maxW+70, rowStep=maxH+120;
  var mnX=1e9,mnY=1e9;
  ids.forEach(function(id){var n=nodeById(id);mnX=Math.min(mnX,n.x);mnY=Math.min(mnY,n.y);});
  if(snapOn){mnX=Math.round(mnX/GRID)*GRID;mnY=Math.round(mnY/GRID)*GRID;}
  rows.forEach(function(row,i){
    row.forEach(function(id,j){
      var n=nodeById(id);
      n.x=Math.round(mnX+j*colStep);
      n.y=Math.round(mnY+i*rowStep);
    });
  });
  var idSet=new Set(ids);
  project.edges.forEach(function(e){if(idSet.has(e.from)&&idSet.has(e.to)&&isBridge(e))e.kind='flow';});
  for(var ri=0;ri<rows.length-1;ri++){
    var U=nodeById(rows[ri][rows[ri].length-1]);
    var L=nodeById(rows[ri+1][0]);
    var ex=null;
    project.edges.forEach(function(e){if(e.from===U.id&&e.to===L.id)ex=e;});
    if(ex){ex.kind='bridge';if(!ex.bd)ex.bd={dl:0,dy:0,dr:0};}
    else{project.edges.push({id:uid(),from:U.id,to:L.id,label:'',kind:'bridge',pts:[],lt:0.5,lp:0,fromReply:null,bd:{dl:0,dy:0,dr:0}});}
  }
}
function bridgePairCandidate(){
  if(sel.size!==2||selGroups.size!==0)return null;
  var it=sel.values();
  var a=nodeById(it.next().value), b=nodeById(it.next().value);
  if(!a||!b)return null;
  function hasOut(n){return project.edges.some(function(e){return e.from===n.id;});}
  function hasIn(n){return project.edges.some(function(e){return e.to===n.id;});}
  if(!hasOut(a)&&!hasIn(b))return{a:a.id,b:b.id};
  if(!hasOut(b)&&!hasIn(a))return{a:b.id,b:a.id};
  return null;
}
function createBridgeBetween(srcId,dstId){
  pushHistory(serialize());
  var ex=null;
  project.edges.forEach(function(e){if(e.from===srcId&&e.to===dstId)ex=e;});
  if(ex){ex.kind='bridge';if(!ex.bd)ex.bd={dl:0,dy:0,dr:0};}
  else{project.edges.push({id:uid(),from:srcId,to:dstId,label:'',kind:'bridge',pts:[],lt:0.5,lp:0,fromReply:null,bd:{dl:0,dy:0,dr:0}});}
  renderAll();
  markDirty();
  toast('Мост создан');
}
var dstState={ids:null,k:4};
function dstApply(){
  if(!dstState.ids)return;
  layoutRows(dstState.ids,dstState.k);
  renderAll();
  markDirty();
}
function dstClamp(v){
  var m=dstState.ids?dstState.ids.length:1;
  if(isNaN(v))v=1;
  if(v<1)v=1;
  if(v>m)v=m;
  return v;
}
function dstSetK(v){
  var nk=dstClamp(v);
  dstState.k=nk;
  var inp=$('#dstVal');
  if(inp)inp.value=nk;
  dstApply();
}

function openDistributeModal(){
  var ids=[];
  sel.forEach(function(id){if(nodeById(id))ids.push(id);});
  if(ids.length<2){toast('Выделите минимум два элемента','warn');return;}
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  ids.forEach(function(id){
    var n=nodeById(id);
    minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+NODE_W);maxY=Math.max(maxY,n.y+90);
  });
  var horizontal=(maxX-minX)>=(maxY-minY);
  ids.sort(function(a,b){
    var na=nodeById(a),nb2=nodeById(b);
    if(horizontal)return (na.x-nb2.x)||(na.y-nb2.y);
    return (na.y-nb2.y)||(na.x-nb2.x);
  });
  if(ids.length===2){
    pushHistory(serialize());
    layoutRows(ids,1);
    renderAll();
    markDirty();
    toast('Две строки по одному элементу, стык соединён мостом');
    return;
  }
  dstState.ids=ids;
  dstState.k=dstClamp(4);
  pushHistory(serialize());
  dstApply();
  $('#dstVal').value=dstState.k;
  $('#dstWin').classList.add('show');
  placeDstWinDefault();
}

/* ═══ группы ═══ */
function createGroupFromSel(name){
  var nodeIds=[];sel.forEach(function(id){if(nodeById(id))nodeIds.push(id);});
  var groupIds=[];selGroups.forEach(function(gid){if(groupById(gid))groupIds.push(gid);});
  var lkCg=lockBlockedBy(nodeIds.concat(groupIds));
  if(lkCg){showLockTip(lastPtr.x,lastPtr.y,lkCg);return;}
  if(nodeIds.length+groupIds.length<2){toast('Выделите минимум два объекта (узлы и/или группы)','warn');return;}
  var selGset=new Set(groupIds);
  var topGroups=groupIds.filter(function(gid){
    var g=groupById(gid),p=g.parent?groupById(g.parent):null,guard=0;
    while(p&&guard++<40){if(selGset.has(p.id))return false;p=p.parent?groupById(p.parent):null;}
    return true;
  });
  var chains=[];
  nodeIds.forEach(function(id){
    var n=nodeById(id);
    chains.push(n&&n.gid?chainOfG(n.gid):[]);
  });
  topGroups.forEach(function(gid){
    var g=groupById(gid);
    chains.push(g.parent?chainOfG(g.parent):[]);
  });
  var common=null;
  if(chains.length){
    var inter=new Set(chains[0]);
    for(var i=1;i<chains.length;i++){
      var s=new Set(chains[i]),nxt=new Set();
      inter.forEach(function(x){if(s.has(x))nxt.add(x);});
      inter=nxt;
    }
    var best=null,bestD=-1;
    inter.forEach(function(gid){
      if(selGset.has(gid))return;
      var d=groupDepth(groupById(gid));
      if(d>bestD){bestD=d;best=gid;}
    });
    common=best;
  }
  pushHistory(serialize());
  var gidN=uid();
  var newG={id:gidN,name:(name&&name.trim())||'Группа',fold:2,x:0,y:0,parent:common||null,color:null,alpha:0.55,badge:false,bbox:null,hh:null,auto:false,fx:null,fy:null,fw:null,fh:null};
  project.groups.push(newG);
  topGroups.forEach(function(gid){var gg=groupById(gid);if(gg)gg.parent=gidN;});
  nodeIds.forEach(function(id){
    var n=nodeById(id);if(!n)return;
    var inside=false;
    if(n.gid){
      var ch=chainOfG(n.gid);
      for(var k=0;k<ch.length;k++){if(selGset.has(ch[k])){inside=true;break;}}
    }
    if(!inside)n.gid=gidN;
  });
  renderAll();
  var fr=frameRectOf(newG);
  if(fr){newG.fx=fr.x;newG.fy=fr.y;newG.fw=fr.w;newG.fh=fr.h;refreshGroupFrames();}
  markDirty();
  selectGroup(gidN);
  toast('Группа «'+((name&&name.trim())||'Группа')+'» создана'+(common?' (внутри «'+groupById(common).name+'»)':''));
}
function createDrawnGroup(rx,ry,rw,rh){
  pushHistory(serialize());
  var gid=uid();
  var g={id:gid,name:'Группа '+(project.groups.length+1),fold:2,x:0,y:0,parent:null,color:null,alpha:0.55,badge:false,bbox:null,hh:null,auto:false,fx:rx,fy:ry,fw:rw,fh:rh};
  project.groups.push(g);
  var cntN=captureNodesInto(g);
  var cntG=captureGroupsInto(g);
  var c={x:rx+rw/2,y:ry+rh/2};
  var excl=new Set([gid]);
  project.groups.forEach(function(o){if(o.parent===gid)excl.add(o.id);});
  var t2=groupDropTargetAt(c.x,c.y,excl);
  g.parent=t2?t2.id:null;
  renderAll();markDirty();
  selectGroup(gid);
  setTimeout(function(){var i=$('#igName');if(i){i.focus();i.select();}},40);
  toast('Группа создана'+(cntN?' · элементов: '+cntN:'')+(cntG?' · вложено групп: '+cntG:''));
}
function ungroup(gid){
  var g=groupById(gid);if(!g)return;
  var lkUg=lockBlockedBy([gid].concat(membersOf(gid).map(function(n){return n.id;})));
  if(lkUg){showLockTip(lastPtr.x,lastPtr.y,lkUg);return;}
  pushHistory(serialize());
  project.nodes.forEach(function(n){if(n.gid===gid)n.gid=g.parent||null;});
  project.groups.forEach(function(cg){if(cg.parent===gid)cg.parent=g.parent||null;});
  project.groups=project.groups.filter(function(x){return x.id!==gid;});
  selGroups.delete(gid);
  if(selGroup===gid)selGroup=null;
  renderAll();markDirty();

function splitPtsAtHalf(e,g){
  var pts=e.pts;
  if(!pts||!pts.length||!g)return[null,null];
  var P=[{x:g.x1,y:g.y1}];
  pts.forEach(function(p){P.push({x:p.x,y:p.y});});
  P.push({x:g.x2,y:g.y2});
  var lens=[],total=0,i;
  for(i=1;i<P.length;i++){var l=Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);lens.push(l);total+=l;}
  var half=total/2,acc=0;
  var a=[],b=[];
  for(i=1;i<P.length-1;i++){
    if(acc+lens[i-1]<half)a.push({x:P[i].x,y:P[i].y});
    else b.push({x:P[i].x,y:P[i].y});
    acc+=lens[i-1];
  }
  return[a.length?a:null,b.length?b:null];
}

function resolveOverlaps(fixedIds){
  var pad=18, nodes=project.nodes;
  function dims(n){var el=nodeEls.get(n.id);return{w:(el&&el.style.display!=='none')?el.offsetWidth:NODE_W,h:(el&&el.style.display!=='none')?el.offsetHeight:90};}
  var oldPos=new Map();
  nodes.forEach(function(n){oldPos.set(n.id,{x:n.x,y:n.y});});
  var changed=false;
  for(var it=0;it<30;it++){
    var moved=false;
    for(var i=0;i<nodes.length;i++){
      if(collapsedAncestorOf(nodes[i]))continue;
      for(var j=i+1;j<nodes.length;j++){
        if(collapsedAncestorOf(nodes[j]))continue;
        var a=nodes[i],b=nodes[j],da=dims(a),db=dims(b);
        var acx=a.x+da.w/2,acy=a.y+da.h/2,bcx=b.x+db.w/2,bcy=b.y+db.h/2;
        var ox=(da.w+db.w)/2+pad-Math.abs(acx-bcx);
        var oy=(da.h+db.h)/2+pad-Math.abs(acy-bcy);
        if(ox>0&&oy>0){
          moved=true;changed=true;
          var fx=fixedIds.has(a.id),fy=fixedIds.has(b.id);
          if(ox<=oy){
            var ax=acx<=bcx?-1:1;
            if(fx&&!fy){b.x-=ax*ox;}
            else if(fy&&!fx){a.x+=ax*ox;}
            else{a.x+=ax*ox/2;b.x-=ax*ox/2;}
          }else{
            var ay=acy<=bcy?-1:1;
            if(fx&&!fy){b.y-=ay*oy;}
            else if(fy&&!fx){a.y+=ay*oy;}
            else{a.y+=ay*oy/2;b.y-=ay*oy/2;}
          }
        }
      }
    }
    if(!moved)break;
  }
  if(!changed)return;
  if(snapOn)nodes.forEach(function(n){
    if(!fixedIds.has(n.id)){n.x=Math.round(n.x/GRID)*GRID;n.y=Math.round(n.y/GRID)*GRID;}
  });
  var targets=[];
  nodes.forEach(function(n){
    var o=oldPos.get(n.id);
    if(o.x!==n.x||o.y!==n.y){
      targets.push({n:n,fromX:o.x,fromY:o.y,toX:n.x,toY:n.y});
      n.x=o.x;n.y=o.y;
    }
  });
  if(targets.length)animateShift(targets);
  refreshGroupFrames();
}
function animateShift(targets){
  var t0=performance.now(),dur=340;
  function step(t){
    var k=Math.min(1,(t-t0)/dur);
    var e2=1-Math.pow(1-k,3);
    targets.forEach(function(g){
      g.n.x=g.fromX+(g.toX-g.fromX)*e2;
      g.n.y=g.fromY+(g.toY-g.fromY)*e2;
      var el=nodeEls.get(g.n.id);
      if(el&&el.style.display!=='none'){el.style.left=g.n.x+'px';el.style.top=g.n.y+'px';}
    });
    targets.forEach(function(g){updateEdgesFor(g.n.id);});
    refreshGroupFrames();
    if(k<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function isTyping(){
  var a=document.activeElement;
  return a&&((a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')||a.isContentEditable);
}
window.addEventListener('keydown',function(e){
  if(e.key==='Alt'&&!isTyping())document.body.classList.add('knife');
  if((e.key==='Control'||e.key==='Meta')&&!isTyping())document.body.classList.add('ctrlpan');
  if(isTyping()){
    if(e.key==='Escape')document.activeElement.blur();
    return;
  }
  if(e.code==='Space'){spaceDown=true;document.body.classList.add('space');e.preventDefault();return;}
  var mod=e.ctrlKey||e.metaKey;
  var code=e.code;
  if(e.key==='F2'&&sel.size===1){
    e.preventDefault();
    var elF=nodeEls.get(sel.values().next().value);
    if(elF&&elF.style.display!=='none')startInlineEdit(elF);
    return;
  }
  if(mod&&code==='KeyZ'&&!e.shiftKey){e.preventDefault();undo();return;}
  if(mod&&(code==='KeyY'||(code==='KeyZ'&&e.shiftKey))){e.preventDefault();redo();return;}
  if(mod&&code==='KeyS'){e.preventDefault();if(e.shiftKey)saveAs();else save();return;}
  if(mod&&code==='KeyO'){e.preventDefault();showProjectsModal();return;}
  if(mod&&e.altKey&&code==='KeyN'){e.preventDefault();projCreate();return;}
  if(mod&&code==='KeyD'){e.preventDefault();var r=duplicateSel();if(r)startCarry(r.ids,r.pre);return;}
  if(mod&&e.shiftKey&&code==='KeyA'){e.preventDefault();alignSelH();return;}
  if(mod&&!e.shiftKey&&code==='KeyG'){e.preventDefault();if(sel.size+selGroups.size>=2)groupModal();else toast('Выделите минимум два объекта (или нарисуйте группу: Ctrl+Shift+ЛКМ)','warn');return;}
  if(mod&&e.shiftKey&&code==='KeyG'){
    e.preventDefault();
    var gidU=selGroup;
    if(!gidU&&selGroups.size)gidU=selGroups.values().next().value;
    if(!gidU&&sel.size===1){var nn=nodeById(sel.values().next().value);if(nn)gidU=nn.gid;}
    if(gidU)ungroup(gidU);else toast('Нет группы для роспуска','warn');
    return;
  }
  if(mod&&code==='KeyA'){e.preventDefault();
    sel=new Set(project.nodes.filter(function(n){return !collapsedAncestorOf(n);}).map(function(n){return n.id;}));
    selGroups.clear();selGroup=null;selEdges.clear();selEdge=null;syncSel();renderInspector();return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSelected();return;}
  if(e.key==='Escape'){
    if(carryS){cancelCarry();return;}
    if(gcreateS){gcreateS=null;marquee.style.display='none';marquee.classList.remove('mg');return;}
    if($('#dstWin').classList.contains('show')){closeDstWin();return;}
    if($('#dlgModal').classList.contains('show')){closeDlgEditor();return;}
    if(connS)finishConnectCancel();
    if(lblDrag){if(lblDrag.lk)lockGive(lblDrag.lk);lblDrag=null;}
    if(wpDrag){if(wpDrag.lk)lockGive(wpDrag.lk);wpDrag=null;}
    closeCtx();closeModal();
    $('#saveMenu').classList.remove('show');$('#saveWrap').classList.remove('open');
    clearSel();return;
  }
  if(code==='KeyF'){if(sel.size===1)centerOn(nodeById(sel.values().next().value));return;}
  if(e.key==='0'){fitView(true);return;}
  if(e.key==='='||e.key==='+'){zoomAt(canvas.clientWidth/2,canvas.clientHeight/2,1.15);return;}
  if(e.key==='-'){zoomAt(canvas.clientWidth/2,canvas.clientHeight/2,1/1.15);return;}
});

function wrapText(s,w){
  var out=[];
  String(s).split('\n').forEach(function(par){
    var words=par.split(/\s+/),line='';
    words.forEach(function(word){
      if(!word)return;
      if((line?line+' '+word:word).length>w){if(line)out.push(line);line=word;}
      else line=line?line+' '+word:word;
    });
    out.push(line);
  });
  return out.join('\n');
}
function indent(s,pre){

function dlgExportText(n){
  ensureDialog(n);
  var d=n.dialog;
  var L=[];
  L.push('◆ Диалог: '+n.title);
  var meta='Статус: '+(STATUS_RU[n.status]||n.status);
  if(d.participants.length)meta+='  ·  Участники: '+d.participants.map(charName).join(', ');
  meta+='  ·  Реплик: '+countReplies(d.replies);
  L.push('  '+meta);
  if(d.description)L.push('  '+wrapText(d.description.trim(),62).split('\n').map(function(l){return '  '+l;}).join('\n').trim());
  function printReplies(replies,depth){
    if(depth>=MAX_DLG_DEPTH)return;
    replies.forEach(function(r){
      var pad='    ';for(var i=0;i<depth;i++)pad+='  ';
      var name=charName(r.speaker);
      L.push(pad+'▸ '+name+': '+(r.text||'(пусто)'));
      var outs=project.edges.filter(function(e){return e.from===n.id&&e.fromReply===r.id;});
      outs.forEach(function(e){
        var t=nodeById(e.to);
        L.push(pad+'     '+(t?t.title:'?')+(e.label?' ['+e.label+']':''));
      });
      if(r.children&&r.children.length)printReplies(r.children,depth+1);
    });
  }
  printReplies(d.replies,0);
  var mainOuts=project.edges.filter(function(e){return e.from===n.id&&!e.fromReply;});
  if(mainOuts.length){
    L.push('  Исход (после диалога):');
    mainOuts.forEach(function(e){
      var t=nodeById(e.to);
      L.push('    → '+(t?t.title:'?')+(e.label?' ['+e.label+']':''));
    });
  }
  return L;
}

function normalize(p){
  p.customTypes=(p.customTypes||[]).map(function(c){
    return{id:c.id||uid(),name:String(c.name||'Элемент').slice(0,40),color:String(c.color||'#e2a54e'),icon:ALLICONS[c.icon]?c.icon:'star'};
  });
  var cmap={};p.customTypes.forEach(function(c){cmap[c.id]=c;});
  p.groups=(p.groups||[]).map(function(g){
    var fold=(g.fold===0||g.fold===1||g.fold===2)?g.fold:(g.collapsed?(g.listOpen===false?0:1):2);
    return{
      id:g.id||uid(),
      name:String(g.name||'Группа').slice(0,60),
      fold:fold,
      x:+g.x||0,y:+g.y||0,
      parent:(typeof g.parent==='string'&&g.parent!==g.id)?g.parent:null,
      color:(typeof g.color==='string'&&/^#([0-9a-f]{6})$/i.test(g.color))?g.color:null,
      alpha:(typeof g.alpha==='number')?clamp(g.alpha,0.1,1):0.55,
      badge:!!g.badge,
      bbox:Array.isArray(g.bbox)?g.bbox:null,
      hh:g.hh||null,
      auto:g.auto===true,
      fx:(typeof g.fx==='number')?g.fx:null,
      fy:(typeof g.fy==='number')?g.fy:null,
      fw:(typeof g.fw==='number')?g.fw:null,
      fh:(typeof g.fh==='number')?g.fh:null
    };
  });
  var gids=new Set(p.groups.map(function(g){return g.id;}));
  p.groups.forEach(function(g){
    if(g.parent&&!gids.has(g.parent))g.parent=null;
  });
  p.nodes=(p.nodes||[]).map(function(n){
    var t=n.type;
    if(!TYPES[t]){
      if(typeof n.ctype==='string'&&cmap[n.ctype])t=n.ctype;
      else if(!cmap[t])t='note';
    }
    var ex=(n.expand===0||n.expand===1||n.expand===2)?n.expand:(n.collapsed?0:1);
    var defTitle=TYPES[t]?TYPES[t].name:(cmap[t]?cmap[t].name:'Элемент');
    var node={id:n.id||uid(),type:t,gid:(typeof n.gid==='string'&&gids.has(n.gid))?n.gid:null,x:+n.x||0,y:+n.y||0,
      title:n.title||defTitle,text:n.text||'',status:STATUS[n.status]?n.status:'idea',
      tags:Array.isArray(n.tags)?n.tags:[],expand:ex,
      color:(typeof n.color==='string'&&/^#([0-9a-f]{6})$/i.test(n.color))?n.color:null,
      tint:(typeof n.tint==='number')?clamp(n.tint,-60,60):0,
dlgWidth:(typeof n.dlgWidth==='number')?clamp(n.dlgWidth,NODE_W,1200):null,notes:Array.isArray(n.notes)?n.notes.map(function(m){return{title:String(m.title||'').slice(0,80),html:String(m.html||''),hidden:!!m.hidden};}):[]};
    if(Array.isArray(n.participants))node.participants=n.participants.filter(function(p){return typeof p==='string';});
    if(t==='dialog'){
      node.dialog={
        participants:Array.isArray(n.dialog&&n.dialog.participants)?n.dialog.participants:[],
        description:(n.dialog&&typeof n.dialog.description==='string')?n.dialog.description:(typeof n.text==='string'?n.text:''),
        replies:Array.isArray(n.dialog&&n.dialog.replies)?n.dialog.replies:[]
      };
    }
    return node;
  });
  var ids=new Set(p.nodes.map(function(n){return n.id;}));
  p.edges=(p.edges||[]).filter(function(e){
    return ids.has(e.from)&&ids.has(e.to)&&e.from!==e.to;
  }).map(function(e){
var kk=KINDS[e.kind]?e.kind:'flow';
if(e.bridge)kk='bridge';
return{id:e.id||uid(),from:e.from,to:e.to,label:e.label||'',kind:kk,
pts:Array.isArray(e.pts)?e.pts.filter(function(pt){return pt&&isFinite(pt.x)&&isFinite(pt.y);}).map(function(pt){return{x:+pt.x,y:+pt.y};}):[],
lt:(typeof e.lt==='number')?clamp(e.lt,0.04,0.96):0.5,
lp:(typeof e.lp==='number')?clamp(e.lp,-44,44):0,
fromReply:(typeof e.fromReply==='string'&&e.fromReply)?e.fromReply:null,
bd:(e.bd&&isFinite(e.bd.dl))?{dl:+e.bd.dl||0,dy:+e.bd.dy||0,dr:+e.bd.dr||0}:{dl:0,dy:0,dr:0}};
});
  p.groups=p.groups.filter(function(g){
    return p.nodes.some(function(n){return n.gid===g.id;});
  });
  p.listHidden=Array.isArray(p.listHidden)?p.listHidden:(Array.isArray(p.hiddenTypes)?p.hiddenTypes:[]);
  p.listHidden=p.listHidden.filter(function(k){return TYPES[k]||cmap[k];});
  return p;
}

/* ═══ менеджер проектов: список, переключение, автосохранение каждого ═══ */
var LS_PROJECTS='vetvi-projects-v1',LS_CURPROJ='vetvi-cur-v1';
var projSkipSaveId=null; /* id удаляемого проекта — не пересохранять его при переключении */
function projRegistry(){
  try{return JSON.parse(localStorage.getItem(LS_PROJECTS)||'[]')||[];}catch(e){return[];}
}
function projSaveRegistry(list){
  try{localStorage.setItem(LS_PROJECTS,JSON.stringify(list));}catch(e){toast('Хранилище переполнено — список проектов не сохранён','err');}
}
function projSlotKey(id){return 'vetvi-project-'+id;}
function projCurId(){
  try{return localStorage.getItem(LS_CURPROJ)||'';}catch(e){return'';}
}
function projSetCur(id){
  try{localStorage.setItem(LS_CURPROJ,id||'');}catch(e){}
}
/* сохранить текущий проект в свой слот + обновить запись реестра */
function projSaveCurrent(){
  if(typeof syncState!=='undefined'&&syncState&&syncState.mode==='copy')return; /* копия хранится отдельно */
  if(!project||!project.meta)return;
  if(projSkipSaveId&&project.meta.projectId===projSkipSaveId)return;
  if(!project.meta.projectId)project.meta.projectId=uid()+uid();
  var list=projRegistry();
  var now=new Date().toISOString();
  var entry=null;
  for(var i=0;i<list.length;i++)if(list[i].id===project.meta.projectId){entry=list[i];break;}
  if(!entry){entry={id:project.meta.projectId,created:project.meta.created||now};list.push(entry);}
  entry.name=project.meta.name||'Без названия';
  entry.modified=project.meta.modified||now;
  entry.nodes=project.nodes?project.nodes.length:0;
  if(typeof syncState!=='undefined'&&syncState&&syncState.enabled&&syncState.room)entry.roomId=syncState.room;
  entry.at=now;
  list.sort(function(a,b){return (b.modified||b.at||'').localeCompare(a.modified||a.at||'');});
  projSaveRegistry(list);
  try{localStorage.setItem(projSlotKey(entry.id),JSON.stringify({project:project,vp:vp,bend:bendMode}));}catch(e){toast('Хранилище переполнено — проект не сохранён','err');}
  projSetCur(entry.id);
}
/* миграция старого одиночного автосейва в реестр */
function projMigrateLegacy(){
  var list=projRegistry();
  if(list.length)return list;
  var raw=null;
  try{raw=localStorage.getItem(LS_KEY)||localStorage.getItem('vetvi-autosave-v16')||localStorage.getItem('vetvi-autosave-v15');}catch(e){}
  if(raw){
    try{
      var d=JSON.parse(raw);
      if(d&&d.project&&Array.isArray(d.project.nodes)){
        var p=d.project;
        if(!p.meta)p.meta={};
        if(!p.meta.projectId)p.meta.projectId=uid()+uid();
        if(!p.meta.created)p.meta.created=new Date().toISOString();
        var now=new Date().toISOString();
        var entry={id:p.meta.projectId,name:p.meta.name||'Без названия',created:p.meta.created,modified:p.meta.modified||now,nodes:(p.nodes||[]).length,roomId:null,at:now};
        try{localStorage.setItem(projSlotKey(entry.id),JSON.stringify({project:p,vp:d.viewport||null,bend:d.bend||null}));}catch(e){}
        list=[entry];
        projSaveRegistry(list);
        return list;
      }
    }catch(e){}
  }
  return [];
}
/* запуск: миграция, загрузка текущего (или указанного в хэше) проекта, подключение к его комнате */
function projInitStartup(){
  var list=projMigrateLegacy();
  if(!list.length){
    var now=new Date().toISOString();
    list=[{id:uid()+uid(),name:'Без названия',created:now,modified:now,nodes:0,roomId:null,at:now}];
    projSaveRegistry(list);
  }
  /* если в хэше указан наш проект — открываем именно его, а не последний активный */
  var hp=syncHashParams(),fromHash=false;
  var cur=projCurId(),entry=null;
  if(hp.project){for(var i=0;i<list.length;i++)if(list[i].id===hp.project){entry=list[i];fromHash=true;break;}}
  if(!entry){for(var j=0;j<list.length;j++)if(list[j].id===cur)entry=list[j];}
  if(!entry)entry=list[0];
  var data=null;
  try{data=JSON.parse(localStorage.getItem(projSlotKey(entry.id))||'null');}catch(e){}
  var p=(data&&data.project)||null;
  if(!p||!Array.isArray(p.nodes)){
    p={meta:{name:entry.name||'Без названия',created:entry.created||new Date().toISOString(),modified:entry.modified||new Date().toISOString(),projectId:entry.id},nodes:[],edges:[],customTypes:[],groups:[],listHidden:[]};
  }
  if(!p.meta)p.meta={};
  if(!p.meta.projectId)p.meta.projectId=entry.id;
  p.viewport=(data&&data.vp)?data.vp:null;
  p.bend=(data&&data.bend)?data.bend:null;
  loadProject(p,null);
  projSetCur(entry.id);
  /* подключаемся только к комнате этого проекта; чужая комната из хэша обрабатывается в initSync */
  var room=(fromHash&&hp.room)?hp.room:(hp.room?null:entry.roomId);
  if(room){
    syncState.mode='room';
    syncConnect(room,entry.id,{own:true,silent:true});
    syncSetHash(room,entry.id);
  }
  return entry;
}
/* открыть проект из списка (текущий предварительно сохраняется) */
function projOpen(id,silent){
  var list=projRegistry();
  var entry=null;
  for(var i=0;i<list.length;i++)if(list[i].id===id)entry=list[i];
  if(!entry){toast('Проект не найден','err');return;}
  if(entry.id===projCurId()&&syncState.mode!=='copy'){toast('Этот проект уже открыт');return;}
  var data=null;
  try{data=JSON.parse(localStorage.getItem(projSlotKey(id))||'null');}catch(e){}
  if(!data||!data.project||!Array.isArray(data.project.nodes)){
    /* битая запись — убираем из списка, чтобы не мешала */
    var rest=list.filter(function(e){return e.id!==id;});
    projSaveRegistry(rest);
    toast('Данные проекта не найдены — запись убрана из списка','err');
    return;
  }
  projSaveCurrent();
  data.project.viewport=data.vp||null;
  data.project.bend=data.bend||null;
  loadProject(data.project,null);
  $('#projName').value=project.meta.name;
  projSetCur(entry.id);
  if(entry.roomId){
    syncState.mode='room';
    syncConnect(entry.roomId,entry.id,{own:true,silent:true});
    syncSetHash(entry.roomId,entry.id);
  }else{
    /* проект вне комнаты — обязательно сбрасываем хэш, чтобы не цепляться к комнате предыдущего проекта */
    syncSetHash(null);
  }
  if(!silent)toast('Открыт проект: '+(entry.name||'Без названия'));
}
/* создать действительно новый проект — старый остаётся в списке */
function projCreate(){
  projSaveCurrent();
  var now=new Date().toISOString();
  var pid=uid()+uid();
  var p={meta:{name:'Новый проект',created:now,modified:now,projectId:pid},nodes:[],edges:[],customTypes:[],groups:[],listHidden:[]};
  loadProject(p,null);
  $('#projName').value=project.meta.name;
  projSetCur(pid);
  projSaveCurrent();
  syncSetHash(null); /* новый проект пока вне комнаты — не наследуем хэш предыдущей */
  fitView(false);
  addNode('scene',0,0,true);
  history=[];future=[];updateHistUI();markSaved();
  toast('Создан новый проект — предыдущий сохранён в списке («Открыть»)');
}
function projDelete(id){
  var list=projRegistry();
  var entry=null;
  var left=list.filter(function(e){if(e.id===id){entry=e;return false;}return true;});
  if(!entry)return;
  projSkipSaveId=id;
  projSaveRegistry(left);
  try{localStorage.removeItem(projSlotKey(id));}catch(e){}
  var wasCur=id===projCurId()&&syncState.mode!=='copy';
  if(wasCur){
    var next=left[0];
    if(next)projOpen(next.id,true);
    else projCreate();
  }
  projSkipSaveId=null;
  toast('Проект удалён'+(wasCur?'':' : '+(entry.name||'Без названия')));
}

      if(doc.bend!==bendMode){bendMode=doc.bend;syncBendButtons();}
    }
    project.nodes=doc.nodes;
    project.edges=doc.edges||[];
    project.customTypes=Array.isArray(doc.customTypes)?doc.customTypes:[];
    project.groups=Array.isArray(doc.groups)?doc.groups:[];
    project.listHidden=Array.isArray(doc.listHidden)?doc.listHidden:[];
    var ids=new Set(project.nodes.map(function(n){return n.id;}));
    var ns=new Set();sel.forEach(function(id){if(ids.has(id))ns.add(id);});sel=ns;
    var eids=new Set(project.edges.map(function(e){return e.id;}));
    var es=new Set();selEdges.forEach(function(id){if(eids.has(id))es.add(id);});selEdges=es;
    if(selEdge&&!eids.has(selEdge))selEdge=null;
    var gids=new Set(project.groups.map(function(g){return g.id;}));
    var gs=new Set();selGroups.forEach(function(id){if(gids.has(id))gs.add(id);});selGroups=gs;
    if(selGroup&&!gids.has(selGroup))selGroup=null;

/* проигранная гонка: сервер отказал в lock для объектов активного жеста — откатываем жест */
function lockHandleDenied(denied){
  var ids={};
  denied.forEach(function(d){if(d&&d.id)ids[d.id]=d.by||{name:'',color:''};});
  var firstBy=denied[0]&&denied[0].by?denied[0].by:null;
  function has(list){for(var i=0;i<list.length;i++)if(ids[list[i]])return true;return false;}
  function drop(list){for(var i=0;i<list.length;i++)delete syncState.myLocks[list[i]];}
  function hidePreviews(src){(src.previews||[]).forEach(function(pr){if(pr.p&&pr.p.parentNode)pr.p.remove();var r=edgeEls.get(pr.eid);if(r)r.g.style.display='';});}
  var hit=false,pre=null;
  if(dragS&&dragS.lk&&has(dragS.lk)){drop(dragS.lk);nodeEls.forEach(function(el){el.classList.remove('dragging');});setDropEdge(null);if(dragS.hoverG){var hg=groupEls.get(dragS.hoverG.id);if(hg)hg.classList.remove('drop-hover-g');}pre=dragS.pre;dragS=null;hit=true;}
  if(gdrag&&gdrag.lk&&has(gdrag.lk)){drop(gdrag.lk);activeGroupDragIds=null;setDropEdge(null);if(gdrag.hoverG){var hg2=groupEls.get(gdrag.hoverG.id);if(hg2)hg2.classList.remove('drop-hover-g');}if(!pre)pre=gdrag.pre;gdrag=null;hit=true;}
  if(dlgResizeS&&dlgResizeS.lk&&has(dlgResizeS.lk)){drop(dlgResizeS.lk);if(!pre)pre=dlgResizeS.pre;dlgResizeS=null;hit=true;}
  if(grestore&&grestore.lk&&has(grestore.lk)){drop(grestore.lk);if(!pre)pre=grestore.pre;grestore=null;hit=true;}
  if(inDrag&&inDrag.nid&&ids[inDrag.nid]){hidePreviews(inDrag);inDrag=null;hit=true;}
  if(outDrag&&outDrag.nid&&ids[outDrag.nid]){hidePreviews(outDrag);outDrag=null;hit=true;}
  if(repOutDrag&&repOutDrag.nid&&ids[repOutDrag.nid]){hidePreviews(repOutDrag);repOutDrag=null;hit=true;}
  if(connS&&connS.lk&&has(connS.lk)){drop(connS.lk);finishConnectCancel();hit=true;}
  if(brDrag&&brDrag.eid&&ids[brDrag.eid]){drop([brDrag.eid]);brDrag=null;hit=true;}
  if(wpDrag&&wpDrag.eid&&ids[wpDrag.eid]){drop([wpDrag.eid]);wpDrag=null;hit=true;}
  if(lblDrag&&lblDrag.eid&&ids[lblDrag.eid]){drop([lblDrag.eid]);lblDrag=null;hit=true;}
  if(rpDrag&&rpDrag.eid&&ids[rpDrag.eid]){drop([rpDrag.eid]);if(rpDrag.prev&&rpDrag.prev.parentNode)rpDrag.prev.remove();rpDrag=null;hit=true;}
  if(dlgModalNode&&ids[dlgModalNode.id]){drop([dlgModalNode.id]);closeDlgEditor();hit=true;}
  if(noteEditorState&&noteEditorState.n&&ids[noteEditorState.n.id]){drop([noteEditorState.n.id]);closeNoteEditor();hit=true;}
  /* проигранная гонка при наборе текста: снимаем фокус с поля */
  if(editLockIds&&editLockIds.length){
    var keepE=[],droppedE=false;
    for(var ei=0;ei<editLockIds.length;ei++){
      if(ids[editLockIds[ei]]){drop([editLockIds[ei]]);droppedE=true;}

/* ── подключение к комнате ── */
function syncConnect(roomId,pid,opts){
  opts=opts||{};
  if(syncState.sock){try{syncState.sock.disconnect();}catch(e){}syncState.sock=null;}
  syncState.enabled=true;syncState.room=roomId;syncState.projectId=pid||null;
  if(syncState.mode!=='copy')syncState.mode='room';
  syncSetStatus('conn');
  renderSyncUI();
  var ioFn=(typeof window.io==='function')?window.io:null;
  if(!ioFn){syncSetStatus('err');toast('Realtime-библиотека недоступна','err');return;}
  var me=syncMe();
  var sock=ioFn('/?XTransformPort=3003',{path:'/',transports:['websocket','polling'],reconnection:true,reconnectionDelay:800,reconnectionDelayMax:4000});
  syncState.sock=sock;
  sock.on('connect',function(){
    sock.emit('vetvi:join',{roomId:roomId,user:{id:me.id,name:me.name,color:me.color}},function(res){
      if(!res||!res.ok){syncSetStatus('err');toast('Не удалось войти в комнату','err');return;}
      syncSetStatus('on');
      syncState.users=res.users||[];
      lockApplyServerList(res.locks);
      if(!syncState.lockHB)syncState.lockHB=setInterval(lockHeartbeat,45000);
      syncState.mergeCount=syncState.mode==='copy'?0:(res.pendingMerges||0);
      renderSyncUI();syncRenderPop();
      var serverDoc=res.doc||null;
      var localJson='';try{localJson=JSON.stringify(syncDocObj());}catch(e){}
      var serverJson='';try{serverJson=serverDoc?JSON.stringify(serverDoc):'';}catch(e){}
      if(!serverDoc){
        syncFlushState(true);
        if(!opts.silent&&!opts.own)toast('Комната открыта — отправьте ссылку соавторам');
      }else if(localJson===serverJson){
        /* уже совпадаем */
      }else if(opts.pushLocal){
        syncFlushState(true);
      }else{
        var localEmpty=project.nodes.length===0;
        var roomPid=(serverDoc.meta&&serverDoc.meta.projectId)?serverDoc.meta.projectId:null;
        /* своя комната (открыли свой проект из списка) без projectId в документе —
           это устаревший снимок этого же проекта, модалка не нужна */
        var sameProject=!!(roomPid&&project.meta.projectId&&roomPid===project.meta.projectId)||(!roomPid&&opts.own===true);
        var serverNewer=!!(serverDoc.meta&&serverDoc.meta.modified&&project.meta.modified&&serverDoc.meta.modified>=project.meta.modified);
        if(localEmpty||(sameProject&&serverNewer)){
          syncApplyRemote(serverDoc,true,opts.own===true);
          toast('Загружено состояние из комнаты');
        }else if(sameProject){
          syncFlushState(true);
          if(!opts.silent)toast('Локальная версия новее — опубликована в комнату','warn');

function copyText(t){

  if(navigator.clipboard&&navigator.clipboard.writeText){

function fallbackCopy(t,done){

    document.execCommand('copy');ta.remove();

/* ── merge ── */
function mergeStats(base,cur){
  function map(arr){var m={};(arr||[]).forEach(function(x){if(x&&x.id)m[x.id]=x;});return m;}
  function cnt(bm,arr){var c=0;(arr||[]).forEach(function(x){var a=bm[x.id];if(a&&JSON.stringify(a)!==JSON.stringify(x))c++;});return c;}
  function adds(bm,arr){var c=0;(arr||[]).forEach(function(x){if(!bm[x.id])c++;});return c;}
  function rems(bm,arr){var c=0;Object.keys(bm).forEach(function(id){var f=null;(arr||[]).forEach(function(x){if(x.id===id)f=x;});if(!f)c++;});return c;}
  base=base||{nodes:[],edges:[],groups:[],customTypes:[]};
  var bN=map(base.nodes),cN=cur.nodes||[],bE=map(base.edges),cE=cur.edges||[],bG=map(base.groups),cG=cur.groups||[],bT=map(base.customTypes),cT=cur.customTypes||[];
  var chD=0,chNotes=0;
  cN.forEach(function(n){
    var a=bN[n.id];if(!a)return;
    if(n.type==='dialog'&&a.type==='dialog'&&JSON.stringify(a.dialog||{})!==JSON.stringify(n.dialog||{}))chD++;
    if(JSON.stringify(a.notes||[])!==JSON.stringify(n.notes||[]))chNotes++;
  });
  return{
    addedNodes:adds(bN,cN),changedNodes:cnt(bN,cN),removedNodes:rems(bN,cN),
    changedDialogs:chD,changedNotes:chNotes,
    addedEdges:adds(bE,cE),changedEdges:cnt(bE,cE),removedEdges:rems(bE,cE),
    addedGroups:adds(bG,cG),changedGroups:cnt(bG,cG),removedGroups:rems(bG,cG),
    changedTypes:cnt(bT,cT)
  };
}
function sendMerge(){
  var cp=syncActiveCopy();
  if(!cp){toast('Откройте копию, чтобы отправить merge','warn');return;}
  if(!cp.sourceRoomId){toast('Копия не привязана к комнате — отправлять некуда','err');return;}
  var cur=JSON.parse(JSON.stringify(syncDocObj()));
  var stats=mergeStats(cp.base,cur);
  var total=(stats.addedNodes+stats.changedNodes+stats.removedNodes+stats.addedEdges+stats.changedEdges+stats.removedEdges);
  if(!total){toast('В копии нет изменений относительно базы — отправлять нечего','warn');return;}
  var me=syncMe();
  syncOpCall('vetvi:merge-send',{roomId:cp.sourceRoomId,copyId:cp.copyId,sender:{name:me.name,color:me.color},stats:stats,doc:{current:cur,base:cp.base}},function(res){
    if(res&&res.ok){
      var list=copiesAll();
      list.forEach(function(c){if(c.copyId===cp.copyId){c.lastMergeId=res.id;c.lastMergeStatus='pending';}});
      copiesSave(list);
      toast('Merge-запрос отправлен владельцу оригинала');
    }else toast('Не удалось отправить merge: '+((res&&res.error)||'ошибка'),'err');
  });
}
/* служебный сокет для merge-операций (вне комнат) */
var syncOpSock=null;
function syncOpCall(ev,payload,cb){
  var ioFn=(typeof window.io==='function')?window.io:null;
  if(!ioFn){cb&&cb({ok:false,error:'no realtime lib'});return;}
  if(!syncOpSock){
    syncOpSock=ioFn('/?XTransformPort=3003',{path:'/',transports:['websocket','polling'],reconnection:true,reconnectionDelay:800,reconnectionDelayMax:4000});
  }
  var send=function(){try{syncOpSock.emit(ev,payload,function(res){cb&&cb(res);});}catch(e){cb&&cb({ok:false,error:'emit failed'});}};
  if(syncOpSock.connected)send();
  else syncOpSock.once('connect',send);
}

function decisionMerge(rid,act){
  var roomId=syncState.room;
  syncOpCall('vetvi:merge-list',{roomId:roomId},function(res){
    var req=null;
    ((res&&res.requests)||[]).forEach(function(x){if(x.id===rid)req=x;});
    if(!req){toast('Merge-запрос не найден','err');return;}
    if(act==='apply'){
      applyMergeRequest(req);
      postDecision(roomId,rid,'applied');
    }else{
      postDecision(roomId,rid,'rejected');
      toast('Merge-запрос отклонён','warn');
    }
    closeModal();
    mergeModal();
  });
}
function postDecision(roomId,rid,decision){
  syncOpCall('vetvi:merge-decide',{roomId:roomId,requestId:rid,decision:decision},function(){});
}
function applyMergeRequest(req){
  var base=req.doc&&req.doc.base,cur=req.doc&&req.doc.current;
  if(!cur||!Array.isArray(cur.nodes)){toast('Повреждённый merge-запрос','err');return;}
  var backups=backupsAll();
  backups.unshift({id:uid(),at:new Date().toISOString(),label:'Перед merge от '+(req.sender&&req.sender.name||'гостя'),doc:JSON.parse(JSON.stringify(syncDocObj()))});
  if(backups.length>10)backups.length=10;
  try{localStorage.setItem(LS_BACKUPS,JSON.stringify(backups));}catch(e){}
  pushHistory(serialize());
  mergeDocInto(base,cur);
  markDirty();
  renderAll();
  toast('Merge применён · бэкап сохранён локально');
}
function mergeDocInto(base,cur){
  function byId(a){var m={};(a||[]).forEach(function(x){if(x&&x.id)m[x.id]=x;});return m;}
  base=base||{nodes:[],edges:[],groups:[],customTypes:[]};
  var bN=byId(base.nodes),cN=byId(cur.nodes),bE=byId(base.edges),cE=byId(cur.edges),bG=byId(base.groups),cG=byId(cur.groups),bT=byId(base.customTypes),cT=byId(cur.customTypes);
  var resIds={};
  function union(curMap,baseMap,curArr,curList){
    var out=[];
    curList.forEach(function(n){
      if(curMap[n.id]){out.push(curMap[n.id]);resIds[n.id]=1;}
      else if(baseMap[n.id]){/* удалено в копии */}
      else{out.push(n);resIds[n.id]=1;}
    });
    curArr.forEach(function(n){if(!resIds[n.id]){out.push(n);resIds[n.id]=1;}});
    return out;
  }
  project.nodes=union(cN,bN,cur.nodes||[],project.nodes);
  project.edges=union(cE,bE,cur.edges||[],project.edges).filter(function(e){
    return resIds[e.from]&&resIds[e.to]&&e.from!==e.to;
  });
  project.groups=union(cG,bG,cur.groups||[],project.groups);
  project.customTypes=union(cT,bT,cur.customTypes||[],project.customTypes);
  if(Array.isArray(cur.listHidden))project.listHidden=cur.listHidden;
  if(cur.meta&&cur.meta.name&&!project.meta.projectId)project.meta.name=cur.meta.name;
}
/* ── привязка панели ── */
function bindSyncUI(){
  var bs=$('#bShare');
  if(bs)bs.onclick=shareProject;
  var bc=$('#bCollab');
  if(bc)bc.onclick=function(e){
    e.stopPropagation();
    var pop=$('#collabPop');
    if(!pop)return;
    if(!syncState.enabled){
      if(syncState.mode==='copy')copyBarModal();
      else shareProject();
      return;
    }
    if(pop.classList.contains('show')){pop.classList.remove('show');return;}
    syncRenderPop();
    var r=bc.getBoundingClientRect();
    pop.style.top=(r.bottom+8)+'px';
    pop.style.right=Math.max(8,(window.innerWidth-r.right))+'px';
    pop.style.left='auto';
    pop.classList.add('show');
  };
  var bcp=$('#bCopies');
  if(bcp)bcp.onclick=copiesModal;
  var bm=$('#bMerge');
  if(bm)bm.onclick=mergeModal;
  document.addEventListener('pointerdown',function(e){
    var pop=$('#collabPop');
    if(pop&&pop.classList.contains('show')&&!pop.contains(e.target)&&e.target.id!=='bCollab'&&!e.target.closest('#bCollab'))pop.classList.remove('show');
  },true);
}
function initSync(){
  if(syncState.initDone)return;
  syncState.initDone=true;
  syncState.me=syncMe();
  if(!$('#collabPop')){
    var pop=document.createElement('div');
    pop.id='collabPop';
    document.body.appendChild(pop);
  }
  bindSyncUI();
  renderSyncUI();
  var p=syncHashParams();
  /* если projInitStartup уже подключился к комнате своего проекта — не переподключаемся;
     чужая комната из хэша (ссылка соавтора) — подключаемся как гость */
  if(p.room&&!syncState.enabled){
    syncState.mode='room';
    syncConnect(p.room,p.project||null,{});
  }
  window.addEventListener('hashchange',function(){
    var np=syncHashParams();
    if(np.room&&np.room!==syncState.room){
      syncState.mode='room';
      syncConnect(np.room,np.project||null,{});
    }
  });
  setInterval(function(){
    if(syncState.pendingRemote&&!syncBusy()&&!syncState.applyingRemote){
      var d=syncState.pendingRemote;
      syncState.pendingRemote=null;
      syncApplyRemote(d);
    }
  },600);
}
/* ═══ запуск ═══ */
try{bindNotesDelegation();window.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if($('#noteModal').classList.contains('show')){closeNoteEditor();}if($('#noteViewModal').classList.contains('show')){closeNoteView();}},true);renderPalette();
  try{
    projInitStartup();
  }catch(e){
    console.warn('Список проектов не прочитан:',e);
    loadProject({meta:{name:'Без названия',created:new Date().toISOString(),modified:new Date().toISOString()},nodes:[],edges:[],customTypes:[],groups:[],listHidden:[]});
    fitView(false);
  }
  $('#projName').value=project.meta.name;
  updateHistUI();updateStatus();
  initSync();
  setTimeout(function(){
    project.nodes.forEach(function(n){updateEdgesFor(n.id);});
    refreshGroupFrames();
    updateDlgRowStates();
    fitView(false);
  },350);
  console.info('Ветви: инициализация завершена. Узлов:',project.nodes.length,'Связей:',project.edges.length,'Групп:',project.groups.length);
}catch(err){
  console.error(err);
  toast('Ошибка запуска: '+err.message,'err');
}
})();
</script>
